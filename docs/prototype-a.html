<title>레미콘 매칭 (Copy)</title>
<!--
  레미콘 매칭·배송관리 — 프로토타입 A (단일 HTML)
  - 서버 없음. 데이터는 목업 + localStorage(브라우저 저장소).
  - 외부 리소스: Leaflet 스크립트(cdnjs), 글꼴(Google Fonts)뿐. 인터넷이 없으면 지도만 빠지고 나머지는 동작한다.
    지도 배경(주요 도로·하천·지명)과 공장→현장 도로 경로는 data/mapdata.js 에 미리 넣어 두었다
    (tools/build-mapdata.ps1 로 생성, © OpenStreetMap 기여자 · 경로 OSRM). 지도 타일 서버를 쓰지 않는다.
  - 링크 공유용 단일 파일(Claude 아티팩트)은 tools/build-artifact.ps1 로 만든다 → dist/
  - 스크립트 구성
      0. 공통 유틸
      1. 설정·규칙 상수         RULES, SPEC_GROUPS …
      2. 목업 데이터             MOCK_SITES, MOCK_PLANTS
      3. 교체 가능한 서비스      SimClock, TravelTimeService, WeatherService, TrackingService
      4. 도메인 로직             PourRules, DeliveryRules, SearchService, OrderService
      5. 저장소(Repository)      Store   ← 프로토타입 B에서 Supabase로 교체
      6. UI                      App, 화면(View), 지도·모달·토스트
  - 실시간 연동 시연: 같은 브라우저에서 이 파일을 탭 두 개로 열고
    한쪽은 '현장', 다른 쪽은 '레미콘사'로 두면 localStorage 'storage' 이벤트로
    서로의 변경이 즉시 반영된다 (Supabase Realtime 자리). 주소 끝에 #supplier 를 붙이면 레미콘사로 열린다.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f2f3f5; --surface:#fff; --surface-2:#f6f7f9; --line:#e4e6eb; --line-2:#d3d7de;
  --ink:#15181e; --ink-2:#3a404b; --muted:#6b7280;
  --brand:#1b2230; --brand-2:#262f3f;
  --accent:#e8620c; --accent-2:#c24f07; --accent-soft:#fff0e5;
  --ok:#157a3c; --ok-soft:#e3f5e9; --warn:#9a5800; --warn-bar:#e0a100; --warn-soft:#fff3d6;
  --bad:#c0262d; --bad-soft:#fde6e6; --info:#1f5fbf; --info-soft:#e4eefc;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --tab-h:62px;
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  /* 지도 배경색 */
  --map-land:#f0eee9; --map-water:#b9d3e6; --map-road:#ffffff; --map-road-edge:#d9d4ca;
  --map-primary:#f7e4b8; --map-trunk:#f2cf96; --map-motorway:#eab37c;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 8px);word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
svg[aria-hidden="true"]{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none} /* 아이콘만 (지도 SVG 제외) */
.muted{color:var(--muted)} .sm{font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid rgba(232,98,12,.45);outline-offset:2px}

/* ── 상단 ── */
:root{padding-top:env(safe-area-inset-top,0px)} /* 노치 영역 (아티팩트 뼈대와 같은 규칙) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1100}
.appbar{background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-size:20px;color:#fff;flex:none}
.brand .t{display:flex;flex-direction:column;line-height:1.15;min-width:0;font-weight:800;letter-spacing:-.02em;font-size:16px;white-space:nowrap}
.brand small{font-weight:500;font-size:11px;opacity:.6;letter-spacing:0}
.role-switch{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;flex:none}
.role-switch button{border:0;background:none;color:#c9d0db;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
.role-switch button[aria-pressed="true"]{background:#fff;color:var(--brand)}
.icon-btn{border:0;background:rgba(255,255,255,.1);color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.icon-btn.light{background:var(--surface-2);color:var(--ink-2);font-size:15px}
.clockbar{background:var(--brand-2);color:#c7ceda;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 16px}
#clock{font-variant-numeric:tabular-nums}
.clock-right{display:flex;align-items:center;gap:6px}
.sim-chip{background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;font-weight:700;font-size:11px}
.speed-btn{border:1px solid rgba(255,255,255,.28);background:none;color:#fff;border-radius:6px;padding:0 8px;font-size:12px;font-weight:700;line-height:20px}

/* ── 탭바: 모바일 하단 고정 / 데스크톱 상단 ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1100;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.04)}
.tabbar button{flex:1;height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.tabbar .ico{font-size:22px;display:flex}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .count{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
@media (min-width:900px){
  body{padding-bottom:24px}
  .tabbar{position:static;box-shadow:none;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px;padding:0 16px}
  .tabbar button{flex:none;flex-direction:row;height:46px;padding:0 18px;font-size:14px;gap:8px;border-bottom:2px solid transparent}
  .tabbar .ico{font-size:18px}
  .tabbar button[aria-current="page"]{border-bottom-color:var(--accent)}
  .tabbar .count{position:static}
}

/* ── 레이아웃 ── */
.container{max-width:1100px;margin:0 auto;padding:14px 16px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-head h2,.card-head h3{font-size:16px}
.section-head{display:flex;align-items:center;gap:8px;margin-top:4px}
.section-head h2{font-size:16px}
.count-chip{background:var(--brand);color:#fff;border-radius:999px;font-size:12px;font-weight:800;min-width:22px;height:22px;padding:0 7px;display:inline-grid;place-items:center}
.split{display:flex;flex-direction:column;gap:12px}
.split-list{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:900px){
  .view-search{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
.foot-note{font-size:12px;color:var(--muted);text-align:center;padding-top:0}

/* ── 폼 ── */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;border:0;margin:0;padding:0}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);padding:0}
.lbl small{font-weight:500;color:var(--muted);margin-left:4px}
input[type=number],input[type=text],input[type=datetime-local],select,textarea{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:9px 11px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,98,12,.15)}
select:disabled{background:var(--surface-2);color:var(--muted)}
.unit-input{position:relative;display:flex}
.unit-input input{padding-right:42px}
.unit-input em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr;gap:10px}
.span-2{grid-column:span 2}
@media (min-width:600px){.grid-3{grid-template-columns:repeat(3,1fr)}}
@media (max-width:359px){.grid-2{grid-template-columns:1fr}.span-2{grid-column:auto}}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.stepper{display:flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:#fff}
.stepper button{width:46px;border:0;background:var(--surface-2);font-size:20px;font-weight:700;color:var(--ink-2);flex:none}
.stepper input{border:0;border-radius:0;text-align:center;min-width:0;font-weight:800;font-size:18px;box-shadow:none!important;padding:8px 2px}
.stepper em{align-self:center;padding:0 8px 0 0;font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.spec-chips{display:flex;flex-wrap:wrap;gap:6px}
.spec-chips label{display:inline-flex;position:relative}
.spec-chips input{position:absolute;opacity:0;pointer-events:none}
.spec-chips span{border:1px solid var(--line-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;background:#fff}
.spec-chips input:checked + span{background:var(--brand);border-color:var(--brand);color:#fff}
.spec-chips input:focus-visible + span{outline:3px solid rgba(232,98,12,.45)}
.form-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.dirty-note{font-size:13px;color:var(--warn);font-weight:700;margin-right:auto}

/* ── 버튼·배지 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:#fff;color:var(--ink);font-weight:700;font-size:15px;transition:background .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{border-color:#f1b4b4;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.linkbtn{border:0;background:none;color:var(--info);font-weight:600;font-size:13px;padding:4px;text-decoration:underline;text-underline-offset:2px}
.pill{display:inline-flex;align-items:center;border-radius:999px;font-size:12px;font-weight:800;padding:3px 9px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.tone-ok{background:var(--ok-soft);color:var(--ok)}
.tone-warn{background:var(--warn-soft);color:var(--warn)}
.tone-bad{background:var(--bad-soft);color:var(--bad)}
.tone-info{background:var(--info-soft);color:var(--info)}
.tone-accent{background:var(--accent-soft);color:var(--accent-2)}
.tone-muted{background:#eceef1;color:var(--muted)}
.seg{display:flex;background:#e6e8ec;border-radius:11px;padding:3px;gap:2px}
.seg button,.seg label{flex:1;border:0;background:none;border-radius:9px;padding:7px 10px;font-size:13.5px;font-weight:700;color:var(--ink-2);text-align:center;cursor:pointer;position:relative}
.seg button[aria-pressed="true"],.seg label:has(input:checked){background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg b{color:var(--bad);margin-left:3px}
.alert{border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--info-soft);color:var(--info)}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.checks li{display:flex;gap:7px;align-items:flex-start}
.checks li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c,#c3c8d0);flex:none}
.lv-ok{--c:var(--ok)} .lv-warn{--c:var(--warn-bar)} .lv-bad{--c:var(--bad)} .lv-info{--c:var(--info)}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* ── 공장 찾기 ── */
.cond{display:flex;flex-direction:column;gap:12px}
.temp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.temp-row .unit-input{width:112px}
.temp-row .src{font-size:12px;color:var(--muted)}
.rule{display:flex;flex-direction:column;gap:8px}
.rule-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.rule-head b{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-left:2px}
.budget{display:flex;height:30px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:800;color:#fff}
.budget span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;min-width:0}
.budget .prep{background:#8a94a6}.budget .travel{background:var(--accent)}.budget .buffer{background:#4b5566}
.budget-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.budget-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.formula{font-size:12.5px;color:var(--ink-2)}
.formula b{color:var(--accent-2);font-size:15px}
.settings-box{border-top:1px solid var(--line);padding-top:8px}
.settings-box summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0}
.settings-box summary::-webkit-details-marker{display:none}
.settings-box summary::after{content:"▾";color:var(--muted)}
.settings-box[open] summary::after{content:"▴"}
.settings-box summary span{font-weight:500;font-size:12.5px;color:var(--muted);margin-left:auto}
.settings-box .grid-2{margin:10px 0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list-head h2{font-size:16px}
.list-head h2 small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.list-tools{display:flex;gap:10px;align-items:center}
.list-tools select{min-height:36px;padding:5px 8px;font-size:13.5px;width:auto}
.plant-list{display:flex;flex-direction:column;gap:10px}
.plant-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s}
.plant-card.lv-bad{--c:#cfd3da;background:#fafafb}
.plant-card.is-hl{box-shadow:0 0 0 3px rgba(232,98,12,.4)}
.pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pc-top h3{font-size:16px;letter-spacing:-.01em}
.pc-top p{font-size:12.5px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.m{background:var(--surface-2);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;min-width:0}
.m .k{font-size:11.5px;color:var(--muted);font-weight:600}
.m .v{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.m .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:1px}
.card .m{border:0}
.meter{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.meter .bar{height:8px;background:#eceef2;border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.upd{font-size:12px;color:var(--muted)} .upd.stale{color:var(--warn);font-weight:700}

/* ── 지도 ── */
.map-card{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);isolation:isolate}
.map{height:300px;width:100%;background:#e8eaed}
@media (min-width:900px){.map{height:400px}}
.map-legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line)}
.map-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:800;background:var(--brand);color:#fff;padding:6px 8px 6px 14px;border-radius:999px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap}
.map-hint .btn{min-height:28px;color:#fff;border-color:rgba(255,255,255,.4)}
.map-fallback{height:180px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:13px;background:var(--surface-2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:-1px}
.ring{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px dashed var(--accent);margin-right:5px;vertical-align:-2px}
.mk{background:none;border:0}
.mk-plant{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 7px));background:#fff;border:2px solid var(--c,#475569);color:var(--c,#475569);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.mk-plant::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--c,#475569);border-bottom:0}
.mk-plant.lv-bad{--c:#9aa1ad;opacity:.8}
.mk-plant.plain{--c:#475569}
.mk-site{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 8px));background:var(--accent);color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px rgba(232,98,12,.45)}
.mk-site::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--accent);border-bottom:0}
.mk-truck{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:19px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mk-truck b{position:absolute;top:-9px;right:-12px;background:#fff;color:var(--c);border:1.5px solid var(--c);border-radius:999px;font-size:10.5px;padding:0 4px;line-height:15px;white-space:nowrap}
.mk-truck.ph-loading{--c:#b86e00} .mk-truck.ph-transit{--c:var(--info)} .mk-truck.ph-onsite{--c:var(--accent)}

/* ── 배송 카드 ── */
.dlv-list{display:flex;flex-direction:column;gap:10px}
.dlv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.dlv-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlv-title{font-size:16px;font-weight:800}
.plate{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:6px}
.dlv-route{font-size:14px;color:var(--ink-2)}
.dlv-meta{font-size:12.5px;color:var(--ink-2)}
.limit{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.limit-bar{position:relative;height:12px;background:#eceef2;border-radius:99px}
.limit-bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .9s linear;max-width:100%}
.limit-bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.limit-bar .mark::after{content:attr(data-l);position:absolute;top:-17px;left:0;transform:translateX(-50%);font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--ink-2)}
.limit-text{display:flex;justify-content:space-between;font-size:13px;gap:8px;flex-wrap:wrap}
.limit-text b{font-variant-numeric:tabular-nums}
.limit.lv-bad .limit-text [data-live="remain"]{color:var(--bad)}
.limit.lv-warn .limit-text [data-live="remain"]{color:var(--warn)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11.5px}
.steps li{display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--muted);position:relative;padding-top:14px}
.steps li::before{content:"";position:absolute;top:0;width:10px;height:10px;border-radius:50%;background:#d3d7de;z-index:1}
.steps li:not(:last-child)::after{content:"";position:absolute;top:4px;left:50%;width:100%;height:2px;background:#d3d7de}
.steps li.on{color:var(--ink)} .steps li.on::before{background:var(--accent)} .steps li.on:not(:last-child)::after{background:#f3b48a}
.steps b{font-size:13px;font-variant-numeric:tabular-nums}
.dlv-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dlv-actions .eta{flex:1;font-size:13px;font-weight:700;color:var(--ink-2);min-width:140px}

/* ── 주문 카드 ── */
.order{display:flex;flex-direction:column;gap:10px}
.order-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.order-head > div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.order-route{font-size:15px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:11.5px;color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:700;font-size:14px}
.kv dd small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.txt-ok{color:var(--ok)} .txt-warn{color:var(--warn)} .txt-bad{color:var(--bad)}
.note{font-size:13px;background:var(--surface-2);border-radius:8px;padding:7px 10px;color:var(--ink-2)}
.progress{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.progress .bar{height:8px;background:#eceef2;border-radius:99px;overflow:hidden;position:relative}
.progress .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.progress .bar .shipped{background:#f6c29c} .progress .bar .done{background:var(--ok)}
.progress-text{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dl-rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.dl-rows li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.dl-rows li:last-child{border-bottom:0}
.dl-no{display:flex;flex-direction:column;line-height:1.25}
.dl-no small{color:var(--muted);font-size:11px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:599px){.actions .btn{flex:1}}
.mini{padding:11px 14px;display:flex;flex-direction:column;gap:3px}
.mini .row{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ── 레미콘사 ── */
.acting{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--brand);color:#fff;border-color:var(--brand)}
.acting .lbl{color:#c7ceda}
.acting-ico{font-size:26px;display:flex;color:var(--accent)}
.acting-sel{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.acting select{background:#2d3749;color:#fff;border-color:#3d475a}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-row .m{background:var(--surface);border:1px solid var(--line)}
.fleet{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fleet li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12.5px;background:var(--surface-2)}
.fleet .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.fleet .plate{margin:0}
.dispatch-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.dispatch-form .field:first-child{grid-column:span 2}
.dispatch-form .btn{grid-column:span 2}
@media (min-width:600px){.dispatch-form{grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto}.dispatch-form .field:first-child,.dispatch-form .btn{grid-column:auto}}
.preview{font-size:13px;border-radius:10px;padding:8px 11px;background:var(--surface-2);border-left:4px solid var(--c,#c3c8d0)}
.preview small{color:var(--muted)}
.preview-card{pointer-events:none}

/* ── 콘크리트 사양 입력 ── */
.grid-cond{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:430px){.grid-cond{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.spec-sum{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:8px 12px;text-align:left}
.spec-sum:hover{border-color:var(--accent)}
.spec-sum-main{flex:1;display:flex;flex-direction:column;min-width:0}
.spec-sum-main b{font-size:16px;font-variant-numeric:tabular-nums}
.spec-sum-main small{font-size:12.5px;color:var(--muted)}
.spec-sum-edit{font-size:13px;font-weight:700;color:var(--accent-2);background:var(--accent-soft);border-radius:8px;padding:4px 10px;flex:none}
.spec-form{display:flex;flex-direction:column;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.spec-form .seg{background:#e3e5e9}
.spec-form .unit-input{margin-top:6px}
.custom-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:6px}
.custom-row .unit-input{margin-top:0}
.ks-note{font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 10px;background:#fff;border-left:4px solid var(--c)}
.ks-note.lv-ok{color:var(--ok)} .ks-note.lv-warn{color:var(--warn)} .ks-note.lv-bad{color:var(--bad)}
.cap-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cap-type{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.cap-type .unit-input input{min-height:38px;padding:6px 44px 6px 10px}
.cap-type:has(input[type=checkbox]:not(:checked)) .unit-input{opacity:.4}

/* ── 실시간 도착 예정 ── */
.eta-box{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;background:var(--info-soft);border-radius:10px;padding:8px 12px}
.eta-k{font-size:12.5px;font-weight:700;color:var(--info)}
.eta-v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);border-radius:6px;padding:0 4px}
.eta-sub{font-size:13px;color:var(--ink-2);flex:1;min-width:120px}
.eta-v.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#ffd9a8}100%{background:transparent}}
.route-swatch{display:inline-block;width:18px;height:5px;border-radius:3px;background:#1f5fbf;margin-right:5px;vertical-align:2px}
.route-swatch.done{height:0;border-top:3px dotted #3a404b;background:none;border-radius:0}
.mk-place{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;font-weight:700;color:#5b5446;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;pointer-events:none}
.mk-place.town{font-size:11px;font-weight:500;color:#7a7263}
@media (prefers-reduced-motion:reduce){.eta-v.flash{animation:none}.limit-bar i{transition:none}}

/* ── 모달·토스트 ── */
.modal-backdrop{position:fixed;inset:0;z-index:2000;background:rgba(15,20,30,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;outline:none}
.modal.wide{max-width:720px}
@media (min-width:640px){.modal-backdrop{align-items:center;padding:24px}.modal{border-radius:18px}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.modal-head h2{font-size:18px}
.modal-body{padding:4px 18px 16px;overflow:auto}
.modal-foot{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.modal-foot .btn{flex:1}
.confirm-msg{white-space:pre-line;font-size:15px}
.sheet-route{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sheet-route div{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.sheet-route .k{font-size:11.5px;color:var(--muted);font-weight:600}
.guide{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom));z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,440px);pointer-events:none}
@media (min-width:900px){#toast-root{bottom:24px}}
.toast{background:#1b2230;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s;transition:opacity .3s,transform .3s;border-left:4px solid #6ea8ff;width:100%}
.toast.ok{border-left-color:#3ccf75} .toast.warn{border-left-color:#f5b73b} .toast.bad{border-left-color:#ff6b6b}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}}

/* ── 납품서 ── */
.note-doc{border:1.5px solid var(--ink);border-radius:4px;padding:14px;background:#fff}
.note-doc h3{text-align:center;font-size:18px;letter-spacing:.12em}
.note-no{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 10px}
.note-grid{display:grid;grid-template-columns:92px 1fr;border-top:1px solid #9aa1ad;border-left:1px solid #9aa1ad;font-size:13px}
.note-grid > div{border-right:1px solid #9aa1ad;border-bottom:1px solid #9aa1ad;padding:6px 8px;min-width:0}
.note-grid .k{background:#f1f3f6;font-weight:700;font-size:12px}
.note-grid small{display:block;color:var(--muted);font-size:11.5px}
@media (min-width:560px){.note-grid{grid-template-columns:100px 1fr 100px 1fr}.note-grid .v.full{grid-column:span 3}}
.note-fine{font-size:11.5px;color:var(--muted);margin-top:8px}
@media print{
  body{background:#fff;padding:0}
  body > *:not(#modal-root){display:none!important}
  .modal-backdrop{position:static;background:none;display:block;padding:0}
  .modal-backdrop:not(:last-child){display:none}
  .modal{max-height:none;box-shadow:none;border-radius:0;max-width:none}
  .modal-head,.modal-foot{display:none}
}

/**
 * 시연 시계. 모든 시각 계산은 Date.now() 대신 SimClock.now()를 쓴다.
 * 배속을 올리면 차량 이동·타이머가 빨라진다. 탭 간 공유(localStorage).
 * 실서비스에서는 now = Date.now() (서버 시각 보정 정도만 필요).
 */
const SimClock = (() => {
  const KEY = 'remicon.a.clock';
  const listeners = new Set();
  const read = () => { try { const v = JSON.parse(storage.get(KEY)); return v && Number.isFinite(v.baseSim) ? v : null; } catch { return null; } };
  let st = read() || { baseReal: Date.now(), baseSim: Date.now(), speed: 1 };
  const now = () => st.baseSim + (Date.now() - st.baseReal) * st.speed;
  const write = (next) => { st = next; storage.set(KEY, JSON.stringify(st)); listeners.forEach((f) => f()); };
  window.addEventListener('storage', (e) => { if (e.key === KEY) { const v = read(); if (v) { st = v; listeners.forEach((f) => f()); } } });
  return {
    now,
    get speed() { return st.speed; },
    setSpeed(speed) { write({ baseReal: Date.now(), baseSim: now(), speed }); },
    reset() { write({ baseReal: Date.now(), baseSim: Date.now(), speed: 1 }); },
    onChange(fn) { listeners.add(fn); },
  };
})();

/** Google encoded polyline 해독 (data/mapdata.js 는 정밀도 1e-4로 저장) */
function decodePolyline(str, factor = 1e4) {
  const pts = [];
  let i = 0, lat = 0, lng = 0;
  const next = () => {
    let r = 0, s = 0, b;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20);
    return r & 1 ? ~(r >> 1) : r >> 1;
  };
  while (i < str.length) { lat += next(); lng += next(); pts.push([lat / factor, lng / factor]); }
  return pts;
}
const MAP_DATA = window.RMC_MAP || null;

/**
 * 이동시간 계산
 * 지금: 미리 받아 둔 실제 도로 경로(OSRM, 승용차 기준)에 믹서트럭 보정·시간대 교통 배율을 곱한다.
 *       미리 받아 두지 않은 구간(지도에서 직접 지정한 현장 등)은 직선거리 기반 근사.
 * TODO(프로토타입 B): 카카오모빌리티 길찾기 API 또는 네이버 Directions 5로 교체.
 *   - 대형차(화물) 경로 옵션, 출발 시각 기반 예측 교통 사용
 *   - 반환 형태 { minutes, distanceKm, path:[[lat,lng]...], source } 유지
 */
const TravelTimeService = (() => {
  // ── 목업 파라미터 [가정] ──
  const TRUCK_FACTOR = 1.25; // 승용차 경로시간 → 믹서트럭 (가속·차로 제약)
  const ROAD_FACTOR = 1.35;  // (근사용) 직선거리 → 도로거리 보정계수
  const TRUCK_KMH = 35;      // (근사용) 믹서트럭 평균 주행속도(시내·국도 혼합)
  const FIXED_MIN = 3;       // 공장 출구·현장 진입 고정 소요(분)
  const routeKey = (a, b) => `${a.lat.toFixed(4)},${a.lng.toFixed(4)}>${b.lat.toFixed(4)},${b.lng.toFixed(4)}`;
  const cache = {};
  function bakedRoute(from, to) {
    const key = routeKey(from, to);
    if (cache[key] !== undefined) return cache[key];
    const r = MAP_DATA?.routes?.[key];
    return (cache[key] = r ? { distanceKm: round1(r.d / 1000), carMinutes: r.t / 60, path: decodePolyline(r.p) } : null);
  }
  function trafficFactor(hour) { // 속도 배율: 출퇴근 혼잡 0.75, 심야 1.2
    if ((hour >= 7 && hour < 9) || (hour >= 17 && hour < 19)) return 0.75;
    if (hour >= 22 || hour < 6) return 1.2;
    return 1;
  }
  /** 직선을 약간 휘게 만든 가짜 경로 (지도 표시·위치 보간용) */
  function mockPath(from, to) {
    const seed = hash01(`${from.lat},${from.lng}>${to.lat},${to.lng}`);
    const bend = (seed - 0.5) * 0.3, wiggle = (hash01(String(seed)) - 0.5) * 0.12;
    const dLat = to.lat - from.lat, dLng = to.lng - from.lng;
    const pts = [];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      const off = Math.sin(Math.PI * t) * bend + Math.sin(2 * Math.PI * t) * wiggle;
      pts.push([from.lat + dLat * t + dLng * off * 0.8, from.lng + dLng * t - dLat * off * 1.2]);
    }
    return pts;
  }
  const kmh = (departAt) => TRUCK_KMH * trafficFactor(new Date(departAt).getHours());
  return {
    source: 'mock',
    /** @returns {Promise<{minutes:number, distanceKm:number, path:number[][], source:string}>} */
    async estimate(from, to, departAt = SimClock.now()) {
      const traffic = trafficFactor(new Date(departAt).getHours());
      const r = bakedRoute(from, to);
      if (r) {
        const minutes = Math.round((r.carMinutes * TRUCK_FACTOR) / traffic + FIXED_MIN);
        return { minutes, distanceKm: r.distanceKm, path: r.path, source: 'osrm-cached' };
      }
      const roadKm = haversineKm(from, to) * ROAD_FACTOR;
      const minutes = Math.round((roadKm / kmh(departAt)) * 60 + FIXED_MIN);
      return { minutes, distanceKm: round1(roadKm), path: mockPath(from, to), source: 'mock' };
    },
  };
})();

const WeatherService = (() => {
  // [가정] 서울 월평균기온(평년값 근사, ℃)과 일교차의 절반. 오후 3시가 최고.
  const MONTHLY_MEAN = [-2.0, 0.6, 5.8, 12.4, 17.8, 22.2, 25.0, 25.7, 21.3, 14.6, 7.0, 0.2];
  const DAILY_AMPLITUDE = 4.5;
  return {
    source: 'mock',
    /** @returns {Promise<{tempC:number, at:number, source:string}>} */
    async getTemperature({ lat, lng }, at = SimClock.now()) {
      const d = new Date(at);
      const h = d.getHours() + d.getMinutes() / 60;
      const local = (hash01(`${lat.toFixed(2)},${lng.toFixed(2)}`) - 0.5) * 1.0; // 지역 편차 ±0.5℃
      const tempC = round1(MONTHLY_MEAN[d.getMonth()] + DAILY_AMPLITUDE * Math.cos(((h - 15) / 24) * 2 * Math.PI) + local);
      return { tempC, at, source: 'mock' };

  };
})();

/**
 * 차량 위치 추적
 * TODO(프로토타입 B): 기사용 앱이 GPS를 수초마다 올리고(Supabase 'truck_positions'),
 *   화면은 Realtime 채널을 구독. getPosition 은 마지막 수신 좌표를 돌려주면 된다.
 *   도착 예정 시각(ETA)은 서버에서 "남은 경로 ÷ 최근 속도"로 다시 계산해 내려준다.
 * 목업: 차량마다 교통 흐름(빨라졌다 느려졌다)을 흉내 낸 속도 곡선을 만들고, 그 곡선대로 경로 위를 움직인다.
 */
const TrackingService = (() => {
  /** 경로를 누적 길이로 보고 비율 f 지점의 좌표와 그 지점까지의 꼭짓점 번호 */
  function along(path, f) {
    const segs = [];
    let total = 0;
    for (let i = 1; i < path.length; i++) {
      const [a1, o1] = path[i - 1], [a2, o2] = path[i];
      const len = Math.hypot(a2 - a1, (o2 - o1) * 0.8);
      segs.push(len); total += len;
    }
    let target = clamp(f, 0, 1) * total;
    for (let i = 0; i < segs.length; i++) {
      if (target <= segs[i] || i === segs.length - 1) {
        const t = segs[i] ? clamp(target / segs[i], 0, 1) : 1;
        const [a1, o1] = path[i], [a2, o2] = path[i + 1];
        return { lat: a1 + (a2 - a1) * t, lng: o1 + (o2 - o1) * t, index: i };
      }
      target -= segs[i];
    }
    const last = path[path.length - 1];
    return { lat: last[0], lng: last[1], index: path.length - 2 };
  }
  /**
   * [가정] 교통 흐름 목업. 상대 속도 r(τ) = 1 + bias + a1·sin(…) + a2·sin(…) − (정체 구간이면 jam)  (τ: 출발 후 분)
   *  bias ±15%: 계획보다 전체적으로 빠름/느림 · a1(10~20%)·a2(8%): 흐름의 출렁임
   *  정체: 60% 확률로 운반 중간쯤 2~6분 동안 속도가 45%p 떨어짐 → ETA가 눈에 띄게 늦어짐
   *  최저 속도 0.12배라 멈추지는 않는다. F(τ) = ∫r = "계획 기준으로 몇 분어치 진행했는가"
   */
  function profile(seed, T) {
    const h = (k) => hash01(`${seed}#${k}`);
    return {
      bias: (h('b') - 0.5) * 0.3, a1: 0.1 + h('a') * 0.1, p1: 6 + h('p') * 8, f1: h('f') * 2 * Math.PI,
      a2: 0.08, p2: 2.5 + h('q') * 2, f2: h('g') * 2 * Math.PI,
      jam: h('j') < 0.6 ? { at: T * (0.25 + h('k') * 0.3), len: 2 + h('l') * 4, drop: 0.45 } : null,
    };
  }
  function progressMin(pf, tau) {
    const w1 = (2 * Math.PI) / pf.p1, w2 = (2 * Math.PI) / pf.p2;
    let f = (1 + pf.bias) * tau + (pf.a1 / w1) * (Math.cos(pf.f1) - Math.cos(w1 * tau + pf.f1)) + (pf.a2 / w2) * (Math.cos(pf.f2) - Math.cos(w2 * tau + pf.f2));
    if (pf.jam) f -= pf.jam.drop * clamp(tau - pf.jam.at, 0, pf.jam.len);
    return f;
  }
  /** 속도 곡선대로 달렸을 때 계획 이동시간 T분어치를 다 가는 데 실제 걸리는 분 */
  function actualMinutes(pf, T) {
    let lo = 0, hi = T * 4 + 10;
    for (let k = 0; k < 50; k++) { const mid = (lo + hi) / 2; if (progressMin(pf, mid) < T) lo = mid; else hi = mid; }
    return hi;
  }
  const seedOf = (d) => d.simSeed || d.id;
  return {
    source: 'mock',
    /** (목업 전용) 출하 때 '실제' 도착 시각을 정한다. 실서비스에서는 도착 이벤트로 기록하므로 불필요 */
    mockArrivalAt({ seed, departAt, travelMinutes }) {
      return departAt + Math.round(actualMinutes(profile(seed, travelMinutes), travelMinutes) * MIN);
    },
    /** @returns {Promise<{lat:number, lng:number, index:number, progress:number, etaAt:number, at:number, source:string}>} */
    async getPosition(d, now = SimClock.now()) {
      const T = d.travelMinutes, pf = profile(seedOf(d), T);
      let progress, etaAt;
      if (now <= d.departAt) { progress = 0; etaAt = d.etaInitialAt ?? d.departAt + T * MIN; }
      else if (now >= d.arriveAt) { progress = 1; etaAt = d.arriveAt; }
      else {
        const tau = (now - d.departAt) / MIN;
        const done = progressMin(pf, tau);
        const w = Math.min(tau, 4);                                  // 최근 4분 평균 속도로 남은 시간 추정
        const rate = w > 0.2 ? (done - progressMin(pf, tau - w)) / w : 1 + pf.bias;
        progress = clamp(done / T, 0, 1);
        etaAt = Math.max(now, now + ((T - done) / Math.max(rate, 0.3)) * MIN);
      }
      return { ...along(d.path, progress), progress, etaAt, at: now, source: 'mock' };
    },
  };
})();

/* ==========================================================================
 * 4. 도메인 로직 — UI·저장소와 무관한 규칙 (앱으로 옮겨도 그대로 재사용)
 * ======================================================================== */
const PourRules = {
  isHot: (tempC) => tempC >= RULES.HOT_THRESHOLD_C,
  /** 비비기 시작 ~ 타설 완료 제한시간(분) */
  limitMinutes: (tempC) => (tempC >= RULES.HOT_THRESHOLD_C ? RULES.LIMIT_HOT_MIN : RULES.LIMIT_NORMAL_MIN),
  /** 허용 이동시간 = 제한시간 − 출하 준비시간 − 현장 대기·타설 여유 */
  allowedTravelMinutes(tempC, settings) {
    return PourRules.limitMinutes(tempC) - settings.prepMinutes - settings.siteBufferMinutes;
  },
  judgeTravel(travelMin, allowedMin) {
    const margin = allowedMin - travelMin;
    if (allowedMin <= 0 || margin < 0) return { level: 'bad', label: '시간 초과', margin };
    if (margin < RULES.CAUTION_MARGIN_MIN) return { level: 'warn', label: '시간 빠듯함', margin };
    return { level: 'ok', label: '시간 내 도착', margin };
  },
  /** 공장이 이 사양을 만들 수 있는가 (종류·골재·강도·슬럼프 플로·시멘트) */
  judgeSpec(plant, spec) {
    const c = plant.cap, max = c.maxStrength[spec.type];
    if (max == null) return { level: 'bad', label: `${spec.type} 콘크리트 미생산` };
    if (!c.aggs.includes(spec.aggMm)) return { level: 'bad', label: `골재 ${spec.aggMm}mm 없음` };
    if (spec.strength > max) return { level: 'bad', label: `${strengthLabel(spec)} 불가 (최대 ${max})` };
    if (spec.slumpKind === 'flow' && !c.flow) return { level: 'bad', label: '슬럼프 플로 미생산' };
    if (!c.cements.includes(spec.cement)) return { level: 'bad', label: `${cementShort(spec.cement)} 없음` };
    return { level: 'ok', label: '사양 생산 가능' };
  },
  judgeSupply(plant, volume, spec) {
    if (!plant.isOpen) return { level: 'bad', label: '출하 중지' };
    if (spec) { const sj = PourRules.judgeSpec(plant, spec); if (sj.level === 'bad') return sj; }
    if (plant.availableTrucks <= 0 || plant.availableVolume <= 0) return { level: 'bad', label: '출하 여력 없음' };
    if (volume > plant.availableVolume) return { level: 'warn', label: `물량 부족(${plant.availableVolume}m³ 가능)` };
    return { level: 'ok', label: '출하 가능' };
  },
  worst: (...levels) => levels.reduce((a, b) => (LEVEL_RANK[b] > LEVEL_RANK[a] ? b : a), 'ok'),
};

/** 배송(트럭 1회) 진행 단계는 저장하지 않고 시각으로 계산한다 */
const DeliveryRules = {
  phase(d, now) {
    if (d.completedAt) return 'done';
    if (now < d.departAt) return 'loading';
    if (now < d.arriveAt) return 'transit';
    return 'onsite';
  },
  pourEndAt: (d) => d.completedAt ?? d.arriveAt + UNLOAD_EST_MIN * MIN,
  returnAt: (d) => DeliveryRules.pourEndAt(d) + d.travelMinutes * MIN,
  truckState(d, now) {
    if (now < d.departAt) return 'loading';
    if (now < d.arriveAt) return 'transit';
    if (now < DeliveryRules.pourEndAt(d)) return 'onsite';
    if (now < DeliveryRules.returnAt(d)) return 'returning';
    return 'idle';
  },
  /** 완료된 건: 제한시간 이내 여부 / 진행 중: null */
  withinLimit: (d) => (d.completedAt ? d.completedAt - d.mixStartAt <= d.limitMinutes * MIN : null),
  /** 타설 기한 대비 위험도. 도착 예정(또는 현재) 이후 타설에 쓸 수 있는 시간으로 판단 */
  limitLevel(d, now, etaAt = d.etaInitialAt ?? d.arriveAt) {
    if (d.completedAt) return DeliveryRules.withinLimit(d) ? 'ok' : 'bad';
    const slack = d.limitAt - Math.max(now, etaAt);
    if (slack < 0) return 'bad';
    return slack < 15 * MIN ? 'warn' : 'ok';
  },
};

/** 공장 차량별 현재 상태 (배차 기록 기준) */
function fleetStatus(plant, deliveries, now) {
  const latest = {};
  for (const d of deliveries) if (d.plantId === plant.id && (!latest[d.truckId] || latest[d.truckId].mixStartAt < d.mixStartAt)) latest[d.truckId] = d;
  return trucksOf(plant).map((truck) => {
    const d = latest[truck.id];
    return { truck, delivery: d, state: d ? DeliveryRules.truckState(d, now) : 'idle' };
  });
}

const SearchService = {
  /** 타설 조건(온도·제한시간·허용 이동시간) 계산 */
  async getConditions({ site, pourAt, settings, tempOverride = null }) {
    const weather = await WeatherService.getTemperature(site, pourAt);
    const tempC = tempOverride ?? weather.tempC;
    return {
      weather, tempC, isManualTemp: tempOverride != null, settings,
      limitMinutes: PourRules.limitMinutes(tempC),
      allowedTravelMinutes: PourRules.allowedTravelMinutes(tempC, settings),
    };
  },
  /** 현장 기준 공장 검색 + 판정 */
  async searchPlants({ site, pourAt, volume, spec, settings, tempOverride = null, plantIds = null }) {
    const cond = await SearchService.getConditions({ site, pourAt, settings, tempOverride });
    let plants = await Store.listPlants();
    if (plantIds) plants = plants.filter((p) => plantIds.includes(p.id));
    // [가정] 교통 상황 반영용 출발 시각 = 타설 예정 시각 − 30분 (도착 목표로부터 역산한 근사)
    const departAt = pourAt - 30 * MIN;
    const results = await Promise.all(plants.map(async (plant) => {
      const travel = await TravelTimeService.estimate(plant, site, departAt);
      const travelJudge = PourRules.judgeTravel(travel.minutes, cond.allowedTravelMinutes);
      const supplyJudge = PourRules.judgeSupply(plant, volume, spec);
      return { plant, travel, travelJudge, supplyJudge, level: PourRules.worst(travelJudge.level, supplyJudge.level) };
    }));
    return { ...cond, departAt, results };
  },
};

const OrderService = {
  /** 주문 시점의 판정 기준을 스냅샷으로 저장 (나중에 설정이 바뀌어도 주문 근거가 남도록) */
  async makePlan({ site, plant, pourAt, settings, tempOverride = null }) {
    const cond = await SearchService.getConditions({ site, pourAt, settings, tempOverride });
    const travel = await TravelTimeService.estimate(plant, site, pourAt - 30 * MIN);
    return {
      tempC: cond.tempC, tempManual: cond.isManualTemp, limitMinutes: cond.limitMinutes,
      prepMinutes: settings.prepMinutes, siteBufferMinutes: settings.siteBufferMinutes,
      allowedTravelMinutes: cond.allowedTravelMinutes, travelMinutes: travel.minutes, distanceKm: travel.distanceKm,
    };
  },
  async create({ site, plant, spec, volume, pourAt, note, settings, tempOverride }) {
    if (!isSpec(spec)) throw new Error('콘크리트 사양을 확인하세요');
    const sj = PourRules.judgeSpec(plant, spec);
    if (sj.level === 'bad') throw new Error(`이 공장에서 만들 수 없는 사양입니다: ${sj.label}`);
    const plan = await OrderService.makePlan({ site, plant, pourAt, settings, tempOverride });
    return Store.createOrder({ siteId: site.id, plantId: plant.id, spec, volume, pourAt, note, plan });
  },
  async accept(id) {
    const o = await Store.getOrder(id);
    if (o?.status !== 'requested') throw new Error('이미 처리된 주문입니다');
    return Store.updateOrder(id, { status: 'accepted' });
  },
  async reject(id, reason) {
    const o = await Store.getOrder(id);
    if (o?.status !== 'requested') throw new Error('이미 처리된 주문입니다');
    return Store.updateOrder(id, { status: 'rejected', rejectReason: reason });
  },
  async cancel(id) {
    const o = await Store.getOrder(id);
    if (o?.status !== 'requested') throw new Error('수락 전 주문만 취소할 수 있습니다');
    return Store.updateOrder(id, { status: 'cancelled' });
  },
  /**
   * "지금 출하하면" 계산. 출하 지시 시각 = 비비기 시작 시각으로 본다 [가정].
   * 온도는 출하 시점 현재값 사용. 단, 주문 때 온도를 직접 입력했다면 그 값을 유지 [가정].
   */
  async planDelivery(order, plant, site, now = SimClock.now()) {
    const prep = order.plan.prepMinutes;
    const departAt = now + prep * MIN;
    const travel = await TravelTimeService.estimate(plant, site, departAt);
    const tempC = order.plan.tempManual ? order.plan.tempC : (await WeatherService.getTemperature(site, now)).tempC;
    const limitMinutes = PourRules.limitMinutes(tempC);
    const allowedTravelMinutes = limitMinutes - prep - order.plan.siteBufferMinutes;
    return {
      mixStartAt: now, departAt, arriveAt: departAt + travel.minutes * MIN, limitAt: now + limitMinutes * MIN,
      travel, tempC, tempManual: !!order.plan.tempManual, limitMinutes, allowedTravelMinutes,
      judge: PourRules.judgeTravel(travel.minutes, allowedTravelMinutes),
    };
  },
  async dispatch(orderId, truckId, volume) {
    const order = await Store.getOrder(orderId);
    if (!order || !['accepted', 'delivering'].includes(order.status)) throw new Error('출하할 수 없는 주문 상태입니다');
    const [plant, site, orderDls, plantDls] = await Promise.all([
      Store.getPlant(order.plantId), Store.getSite(order.siteId),
      Store.listDeliveries({ orderId }), Store.listDeliveries({ plantId: order.plantId }),
    ]);
    const shipped = round1(sum(orderDls.map((d) => d.volume)));
    const remaining = round1(order.volume - shipped);
    if (!(volume > 0)) throw new Error('적재 물량을 입력하세요');
    if (volume > TRUCK_CAPACITY_M3) throw new Error(`1대 적재량(${TRUCK_CAPACITY_M3}m³)을 넘을 수 없습니다`);
    if (volume > remaining + 1e-9) throw new Error(`남은 주문 물량은 ${remaining}m³입니다`);
    const truck = trucksOf(plant).find((t) => t.id === truckId);
    if (!truck) throw new Error('배정할 차량을 선택하세요');
    const now = SimClock.now();
    if (plantDls.some((d) => d.truckId === truckId && DeliveryRules.truckState(d, now) !== 'idle')) throw new Error(`${truck.no}호차는 아직 운행 중입니다`);

    const p = await OrderService.planDelivery(order, plant, site, now);
    // 시연용: 교통 흐름 시뮬레이터가 '실제' 도착 시각을 미리 정한다 (화면에는 매 순간 다시 계산한 ETA만 보임).
    // TODO(프로토타입 B): 이 두 줄을 없애고 arriveAt 은 도착 이벤트(지오펜스·기사 '도착' 버튼)로 기록
    const simSeed = `${truckId}|${p.mixStartAt}`;
    const arriveAt = TrackingService.mockArrivalAt({ seed: simSeed, departAt: p.departAt, travelMinutes: p.travel.minutes });
    return Store.batch(async () => {
      const d = await Store.createDelivery({
        orderId, plantId: plant.id, siteId: site.id,
        truckId, truckNo: truck.no, plateNo: truck.plateNo, driver: truck.driver,
        volume: round1(volume), cumVolume: round1(shipped + volume),
        mixStartAt: p.mixStartAt, departAt: p.departAt, etaInitialAt: p.arriveAt, arriveAt, simSeed, limitAt: p.limitAt,
        travelMinutes: p.travel.minutes, distanceKm: p.travel.distanceKm, path: p.travel.path,
        tempC: p.tempC, tempManual: p.tempManual, limitMinutes: p.limitMinutes,
        completedAt: null, returned: false,
      });
      if (order.status === 'accepted') await Store.updateOrder(orderId, { status: 'delivering' });
      // [가정] 출하하면 공개 중인 가용 차량·출하 가능 물량을 자동 차감 (공급자가 언제든 덮어쓸 수 있음)
      await Store.updatePlant(plant.id, {
        availableTrucks: Math.max(0, plant.availableTrucks - 1),
        availableVolume: Math.max(0, round1(plant.availableVolume - volume)),
      });
      return d;
    });
  },
  /** 현장의 타설 완료(인수) 확인 */
  async confirmPour(deliveryId) {
    const now = SimClock.now();
    const d = await Store.getDelivery(deliveryId);
    if (!d || d.completedAt) throw new Error('이미 처리된 납품입니다');
    if (now < d.arriveAt) throw new Error('아직 현장에 도착하지 않았습니다');
    return Store.batch(async () => {
      const updated = await Store.updateDelivery(deliveryId, { completedAt: now });
      const [order, dls] = await Promise.all([Store.getOrder(d.orderId), Store.listDeliveries({ orderId: d.orderId })]);
      const shipped = sum(dls.map((x) => x.volume));
      if (dls.every((x) => x.completedAt) && shipped >= order.volume - 1e-9) await Store.updateOrder(order.id, { status: 'completed' });
      return updated;
    });
  },
  /** 복귀한 차량을 가용 차량 수에 되돌린다 (주기적으로 호출) */
  async maintain(now = SimClock.now()) {
    const due = (await Store.listDeliveries()).filter((d) => !d.returned && DeliveryRules.truckState(d, now) === 'idle');
    if (!due.length) return;
    await Store.batch(async () => {
      for (const d of due) {
        await Store.updateDelivery(d.id, { returned: true });
        const p = await Store.getPlant(d.plantId);
        if (p) await Store.updatePlant(p.id, { availableTrucks: Math.min(p.fleetSize, p.availableTrucks + 1) }, { touch: false });
      }
    });
  },
};

/* ==========================================================================
 * 5. 저장소(Repository)
 *    지금: 메모리 + localStorage. 탭 간 동기화는 'storage' 이벤트.
 *    TODO(프로토타입 B): 같은 메서드 이름으로 Supabase 구현을 만들어 교체.
 *      listX·getX → select, createX·updateX → insert/update, subscribe → Realtime 채널 구독
 * ======================================================================== */
const Store = (() => {
  const KEY = 'remicon.a.db';
  const VERSION = 2; // 2: 콘크리트 사양 객체 · 공장 생산 능력 · 실시간 ETA 필드
  let db = null;
  let batchDepth = 0, batchDirty = false;
  const listeners = new Set();
  const copy = (v) => (v == null ? v : JSON.parse(JSON.stringify(v))); // 호출자가 원본을 직접 고치지 못하게
  const find = (list, id) => list.find((x) => x.id === id);
  const need = (x, what) => { if (!x) throw new Error(`${what}을(를) 찾을 수 없습니다`); return x; };
  const newId = (p) => `${p}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const nextNo = (prefix, width) => { db.seq[prefix] = (db.seq[prefix] || 0) + 1; return `${prefix}-${pad(db.seq[prefix], width)}`; };

  function emit(evt) { listeners.forEach((fn) => { try { fn(evt); } catch (err) { console.error(err); } }); }
  function commit(evt) {
    if (batchDepth > 0) { batchDirty = true; return; }
    storage.set(KEY, JSON.stringify(db));
    emit({ ...evt, remote: false });
  }
  // 다른 탭에서 바뀐 경우 (Supabase Realtime 자리)
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY || !e.newValue) return;
    try { db = JSON.parse(e.newValue); emit({ type: 'sync', remote: true }); } catch (err) { console.warn(err); }
  });

  const matches = (x, filter) => Object.entries(filter).every(([k, v]) => v == null || (Array.isArray(v) ? v.includes(x[k]) : x[k] === v));

  return {
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    async init() {
      try { const saved = JSON.parse(storage.get(KEY)); if (saved?.version === VERSION) { db = saved; return; } } catch { /* 새로 생성 */ }
      db = await buildSeed(VERSION);
      commit({ type: 'seed' });
    },
    async reset() { db = await buildSeed(VERSION); commit({ type: 'reset' }); },
    /** 여러 쓰기를 한 번의 저장·알림으로 묶는다 (Supabase에서는 RPC/트랜잭션) */
    async batch(fn) {
      batchDepth++;
      try { return await fn(); } finally {
        batchDepth--;
        if (batchDepth === 0 && batchDirty) { batchDirty = false; commit({ type: 'batch' }); }
      }
    },

    async getSettings() { return copy(db.settings); },
    async updateSettings(patch) { Object.assign(db.settings, patch); commit({ type: 'settings' }); return copy(db.settings); },

    async listSites() { return copy(db.sites); },
    async getSite(id) { return copy(find(db.sites, id)); },
    async upsertSite(site) {
      const cur = find(db.sites, site.id);
      if (cur) Object.assign(cur, site); else db.sites.push({ ...site });
      commit({ type: 'site', id: site.id });
      return copy(site);
    },

    async listPlants() { return copy(db.plants); },
    async getPlant(id) { return copy(find(db.plants, id)); },
    async updatePlant(id, patch, { touch = true } = {}) {
      const p = need(find(db.plants, id), '공장');
      Object.assign(p, patch);
      if (touch) p.updatedAt = SimClock.now();
      commit({ type: 'plant', id });
      return copy(p);
    },

    async listOrders(filter = {}) { return copy(db.orders.filter((o) => matches(o, filter)).sort((a, b) => b.requestedAt - a.requestedAt)); },
    async getOrder(id) { return copy(find(db.orders, id)); },
    async createOrder(data) {
      const now = SimClock.now();
      const order = { id: newId('o'), no: nextNo(`OR-${mmdd(now)}`, 3), status: 'requested', requestedAt: now, history: [{ status: 'requested', at: now }], ...data };
      db.orders.push(order);
      commit({ type: 'order', id: order.id });
      return copy(order);
    },
    async updateOrder(id, patch) {
      const o = need(find(db.orders, id), '주문');
      if (patch.status && patch.status !== o.status) o.history.push({ status: patch.status, at: SimClock.now() });
      Object.assign(o, patch);
      commit({ type: 'order', id });
      return copy(o);
    },

    async listDeliveries(filter = {}) { return copy(db.deliveries.filter((d) => matches(d, filter)).sort((a, b) => a.mixStartAt - b.mixStartAt)); },
    async getDelivery(id) { return copy(find(db.deliveries, id)); },
    async createDelivery(data) {
      const d = { id: newId('d'), no: nextNo(`DN-${ymd(data.mixStartAt)}`, 4), ...data };
      db.deliveries.push(d);
      commit({ type: 'delivery', id: d.id });
      return copy(d);
    },
    async updateDelivery(id, patch) {
      const d = need(find(db.deliveries, id), '납품');
      Object.assign(d, patch);
      commit({ type: 'delivery', id });
      return copy(d);
    },
  };
})();

/** 시연 시작 상태: 공장·현장 + 주문 3건 (어제 납품 완료 / 수락 대기 / 출하 대기) */
async function buildSeed(version) {
  const now = SimClock.now();
  const plants = MOCK_PLANTS.map((p, i) => ({ ...JSON.parse(JSON.stringify(p)), updatedAt: now - (4 + ((i * 23) % 70)) * MIN }));
  const spec = (type, aggMm, strength, slumpMm, cement = C1, slumpKind = 'slump') => ({ type, aggMm, strength, slumpKind, slumpMm, cement });
  const sites = MOCK_SITES.map((s) => ({ ...s }));
  const settings = { prepMinutes: RULES.DEFAULT_PREP_MIN, siteBufferMinutes: RULES.DEFAULT_SITE_BUFFER_MIN };
  const db = { version, plants, sites, settings, orders: [], deliveries: [], seq: {} };
  const P = (id) => plants.find((p) => p.id === id), S = (id) => sites.find((s) => s.id === id);
  const plan = (site, plant, pourAt) => OrderService.makePlan({ site, plant, pourAt, settings });
  const no = (prefix, width) => { db.seq[prefix] = (db.seq[prefix] || 0) + 1; return `${prefix}-${pad(db.seq[prefix], width)}`; };

  // (1) 어제 납품 완료 — 주문내역·납품서 시연용
  {
    const plant = P('p01'), site = S('s1');
    const day = new Date(now - 24 * 60 * MIN); day.setHours(9, 0, 0, 0);
    const base = day.getTime(), pourAt = base + 60 * MIN;
    const order = {
      id: 'o-seed-1', no: no(`OR-${mmdd(base)}`, 3), status: 'completed', siteId: site.id, plantId: plant.id,
      spec: spec('보통', 25, 24, 150), volume: 18, pourAt, note: '1층 기초 버림 콘크리트', requestedAt: base - 17 * 60 * MIN,
      plan: await plan(site, plant, pourAt), history: [],
    };
    const trucks = trucksOf(plant);
    let cum = 0, lastDone = 0;
    for (let i = 0; i < 3; i++) {
      const mixStartAt = base + (20 + i * 15) * MIN; // 09:20, 09:35, 09:50
      const departAt = mixStartAt + settings.prepMinutes * MIN;
      const tr = await TravelTimeService.estimate(plant, site, departAt);
      const { tempC } = await WeatherService.getTemperature(site, mixStartAt);
      const limitMinutes = PourRules.limitMinutes(tempC);
      const truck = trucks[i * 2];
      const simSeed = `${truck.id}|${mixStartAt}`;
      const arriveAt = TrackingService.mockArrivalAt({ seed: simSeed, departAt, travelMinutes: tr.minutes });
      cum += 6; lastDone = arriveAt + (18 + i * 4) * MIN;
      db.deliveries.push({
        id: `d-seed-${i + 1}`, no: no(`DN-${ymd(base)}`, 4), orderId: order.id, plantId: plant.id, siteId: site.id,
        truckId: truck.id, truckNo: truck.no, plateNo: truck.plateNo, driver: truck.driver, volume: 6, cumVolume: cum,
        mixStartAt, departAt, etaInitialAt: departAt + tr.minutes * MIN, arriveAt, simSeed,
        limitAt: mixStartAt + limitMinutes * MIN, travelMinutes: tr.minutes, distanceKm: tr.distanceKm,
        path: tr.path, tempC, tempManual: false, limitMinutes, completedAt: lastDone, returned: true,
      });
    }
    order.history = [
      { status: 'requested', at: order.requestedAt }, { status: 'accepted', at: order.requestedAt + 25 * MIN },
      { status: 'delivering', at: base + 20 * MIN }, { status: 'completed', at: lastDone },
    ];
    db.orders.push(order);
  }
  // (2) 방금 들어온 주문 요청 — 레미콘사 '수락' 시연용
  {
    const plant = P('p01'), site = S('s2');
    const pourAt = ceilHour(now + 90 * MIN), requestedAt = now - 7 * MIN;
    db.orders.push({
      id: 'o-seed-2', no: no(`OR-${mmdd(now)}`, 3), status: 'requested', siteId: site.id, plantId: plant.id,
      spec: spec('보통', 25, 27, 150, SLAG2), volume: 42, pourAt, note: '지하 1층 기초 매트, 펌프카 현장 대기', requestedAt,
      plan: await plan(site, plant, pourAt), history: [{ status: 'requested', at: requestedAt }],
    });
  }
  // (3) 수락된 주문 — 바로 '출하 지시' 시연용
  {
    const plant = P('p01'), site = S('s3');
    const pourAt = ceilHour(now + 30 * MIN), requestedAt = now - 50 * MIN;
    db.orders.push({
      id: 'o-seed-3', no: no(`OR-${mmdd(now)}`, 3), status: 'accepted', siteId: site.id, plantId: plant.id,
      spec: spec('보통', 25, 24, 150), volume: 24, pourAt, note: '2층 슬래브', requestedAt,
      plan: await plan(site, plant, pourAt),
      history: [{ status: 'requested', at: requestedAt }, { status: 'accepted', at: requestedAt + 12 * MIN }],
    });
  }
  return db;
}

/* ---- 6-3. 토스트 · 모달 ---- */
function toast(msg, tone = 'info') {
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = `toast ${tone}`;
  el.textContent = msg;
  root.append(el);
  while (root.children.length > 3) root.firstElementChild.remove();
  setTimeout(() => el.classList.add('out'), 3600);
  setTimeout(() => el.remove(), 4000);
}

const Modal = {
  open({ title, body, actions = [], onMount, onClose, wide = false }) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = `
      <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1">
        <header class="modal-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn light" data-close aria-label="닫기">✕</button></header>
        <div class="modal-body">${body}</div>
        ${actions.length ? `<footer class="modal-foot">${actions.map((a, i) => `<button type="button" class="btn ${a.kind || ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</footer>` : ''}
      </div>`;
    let closed = false;
    const onKey = (e) => { if (e.key === 'Escape' && $('#modal-root').lastElementChild === wrap) close(); };
    function close() {
      if (closed) return;
      closed = true; wrap.remove(); document.removeEventListener('keydown', onKey); onClose?.();
    }
    const api = { el: wrap, close };
    wrap.addEventListener('click', async (e) => {
      if (e.target === wrap || e.target.closest('[data-close]')) return close();
      const b = e.target.closest('.modal-foot [data-i]');
      if (!b) return;
      const a = actions[Number(b.dataset.i)];
      if (!a.onClick) return close();
      b.disabled = true;
      try { if ((await a.onClick(api)) !== false) close(); } catch (err) { console.error(err); toast(err.message || String(err), 'bad'); } finally { b.disabled = false; }
    });
    document.addEventListener('keydown', onKey);
    $('#modal-root').append(wrap);
    wrap.querySelector('.modal').focus({ preventScroll: true });
    onMount?.(api);
    return api;
  },
  /** window.confirm 대체 (브라우저 기본 대화상자는 모바일·자동화 환경에서 불편) */
  confirm(message, { title = '확인', ok = '확인', danger = false } = {}) {
    return new Promise((resolve) => {
      let answered = false;
      Modal.open({
        title, body: `<p class="confirm-msg">${esc(message)}</p>`,
        actions: [
          { label: '취소', kind: 'ghost', onClick: () => { answered = true; resolve(false); } },
          { label: ok, kind: danger ? 'danger' : 'primary', onClick: () => { answered = true; resolve(true); } },
        ],
        onClose: () => { if (!answered) resolve(false); },
      });
    });
  },
};

/* ---- 6-3b. 콘크리트 사양 입력 (주문 시트 · 검색 조건 공용). p: 요소 id 접두어 ---- */
const SpecForm = {
  html(s, p) {
    const opt = (v, label, cur) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${label}</option>`;
    const custom = (on) => (on ? 'custom' : '');
    const aggCustom = !AGG_OPTIONS.includes(s.aggMm);
    const strOpts = [...(s.type === '포장' ? FLEX_STRENGTH_OPTIONS.map((v) => [v, `휨 ${v.toFixed(1)}MPa`]) : []), ...STRENGTH_OPTIONS.map((v) => [v, `${v}MPa`])];
    const strCustom = !strOpts.some(([v]) => v === s.strength);
    const so = SLUMP_OPTIONS[s.type];
    const slKey = `${s.slumpKind === 'flow' ? 'f' : 's'}:${s.slumpMm}`;
    const slCustom = ![...so.slump.map((v) => `s:${v}`), ...so.flow.map((v) => `f:${v}`)].includes(slKey);
    return `
      <div class="field"><span class="lbl">콘크리트 종류</span>
        <div class="seg" role="radiogroup" aria-label="콘크리트 종류">${CONCRETE_TYPES.map((t) => `<label><input type="radio" name="${p}-type" value="${t}" ${t === s.type ? 'checked' : ''}>${t}</label>`).join('')}</div>
      </div>
      <div class="grid-2">
        <div class="field"><label class="lbl" for="${p}-agg">굵은골재 최대치수</label>
          <select id="${p}-agg">${AGG_OPTIONS.map((v) => opt(v, `${v}mm`, aggCustom ? '' : s.aggMm)).join('')}${opt('custom', '직접입력', custom(aggCustom))}</select>
          <span class="unit-input" id="${p}-agg-cw" ${aggCustom ? '' : 'hidden'}><input id="${p}-agg-c" type="number" inputmode="numeric" min="5" max="80" step="1" value="${aggCustom ? s.aggMm : ''}" placeholder="예) 15" aria-label="굵은골재 최대치수 직접입력"><em>mm</em></span>
        </div>
        <div class="field"><label class="lbl" for="${p}-str">호칭강도${s.type === '포장' ? '<small>포장은 휨강도</small>' : ''}</label>
          <select id="${p}-str">${strOpts.map(([v, l]) => opt(v, l, strCustom ? '' : s.strength)).join('')}${opt('custom', '직접입력', custom(strCustom))}</select>
          <span class="unit-input" id="${p}-str-cw" ${strCustom ? '' : 'hidden'}><input id="${p}-str-c" type="number" inputmode="decimal" min="1" max="100" step="0.5" value="${strCustom ? s.strength : ''}" placeholder="예) 45" aria-label="호칭강도 직접입력"><em>MPa</em></span>
        </div>
        <div class="field span-2"><label class="lbl" for="${p}-sl">슬럼프 또는 슬럼프 플로</label>
          <select id="${p}-sl">
            <optgroup label="슬럼프">${so.slump.map((v) => opt(`s:${v}`, `슬럼프 ${v}mm`, slCustom ? '' : slKey)).join('')}</optgroup>
            ${so.flow.length ? `<optgroup label="슬럼프 플로">${so.flow.map((v) => opt(`f:${v}`, `슬럼프 플로 ${v}mm`, slCustom ? '' : slKey)).join('')}</optgroup>` : ''}
            ${opt('custom', '직접입력', custom(slCustom))}
          </select>
          <div class="custom-row" id="${p}-sl-cw" ${slCustom ? '' : 'hidden'}>
            <select id="${p}-sl-k" aria-label="슬럼프 구분">${opt('slump', '슬럼프', s.slumpKind)}${opt('flow', '슬럼프 플로', s.slumpKind)}</select>
            <span class="unit-input"><input id="${p}-sl-c" type="number" inputmode="numeric" min="0" max="850" step="5" value="${slCustom ? s.slumpMm : ''}" placeholder="예) 100" aria-label="슬럼프 값 직접입력"><em>mm</em></span>
          </div>
        </div>
        <div class="field span-2"><label class="lbl" for="${p}-cem">시멘트 종류</label>
          <select id="${p}-cem">${CEMENT_TYPES.map((c) => opt(c, c, s.cement)).join('')}</select>
        </div>
      </div>
      <p class="ks-note" id="${p}-ks" aria-live="polite"></p>`;
  },
  /** @returns {{spec: object|null, error: string|null}} */
  read(root, p) {
    const q = (id) => root.querySelector(`#${p}-${id}`);
    const num = (v) => (v === '' || v == null ? NaN : Number(v));
    const type = root.querySelector(`input[name="${p}-type"]:checked`)?.value || '보통';
    const aggMm = q('agg').value === 'custom' ? num(q('agg-c').value) : num(q('agg').value);
    const strength = q('str').value === 'custom' ? num(q('str-c').value) : num(q('str').value);
    let slumpKind, slumpMm;
    if (q('sl').value === 'custom') { slumpKind = q('sl-k').value; slumpMm = num(q('sl-c').value); }
    else { const [k, v] = q('sl').value.split(':'); slumpKind = k === 'f' ? 'flow' : 'slump'; slumpMm = Number(v); }
    const error =
      !Number.isInteger(aggMm) || aggMm < 5 || aggMm > 80 ? '굵은골재 최대치수를 5~80mm 사이 정수로 입력하세요'
      : !(strength > 0 && strength <= 100) ? '호칭강도를 0~100MPa 사이로 입력하세요'
      : slumpKind === 'slump' && !(slumpMm >= 0 && slumpMm <= 300) ? '슬럼프는 0~300mm 사이로 입력하세요'
      : slumpKind === 'flow' && !(slumpMm >= 300 && slumpMm <= 850) ? '슬럼프 플로는 300~850mm 사이로 입력하세요' : null;
    return { spec: error ? null : { type, aggMm, strength: round1(strength), slumpKind, slumpMm, cement: q('cem').value }, error };
  },
  /** 컨테이너에 그리고 이벤트 연결. onChange(spec|null) */
  mount(container, spec, p, onChange) {
    const paintKs = () => {
      const { spec: s, error } = SpecForm.read(container, p);
      const el = container.querySelector(`#${p}-ks`);
      if (error) { el.className = 'ks-note lv-bad'; el.textContent = error; }
      else if (isKsSpec(s)) { el.className = 'ks-note lv-ok'; el.textContent = `KS F 4009 표준 조합 · 호칭 ${specCode(s)}`; }
      else { el.className = 'ks-note lv-warn'; el.textContent = `KS F 4009 표에 없는 조합입니다 (${specCode(s)}). 공장과 협의가 필요할 수 있습니다.`; }
      onChange?.(s);
    };
    const render = (s) => { container.innerHTML = SpecForm.html(s, p); paintKs(); };
    container.addEventListener('change', (e) => {
      const t = e.target;
      if (t.name === `${p}-type`) {
        const cement = container.querySelector(`#${p}-cem`)?.value || C1;
        return render({ type: t.value, ...TYPE_DEFAULTS[t.value], cement });
      }
      const wrap = { [`${p}-agg`]: 'agg-cw', [`${p}-str`]: 'str-cw', [`${p}-sl`]: 'sl-cw' }[t.id];
      if (wrap) {
        const w = container.querySelector(`#${p}-${wrap}`);
        w.hidden = t.value !== 'custom';
        if (!w.hidden) w.querySelector('input').focus();
      }
      paintKs();
    });
    container.addEventListener('input', (e) => { if (e.target.type === 'number') paintKs(); });
    render(isSpec(spec) ? spec : { ...DEFAULT_SPEC });
  },
};

/* ---- 6-4. 지도 (Leaflet). 지도 요소는 한 번 만들고 화면을 다시 그릴 때 재부착한다 ---- */
const Maps = {
  entries: {},
  available: () => typeof window.L !== 'undefined',
  mount(key, slot) {
    if (!slot) return null;
    if (!Maps.available()) {
      slot.outerHTML = '<div class="map-fallback">지도를 불러오지 못했습니다 (인터넷 연결 필요).<br>지도 외 기능은 정상 동작합니다.</div>';
      return null;
    }
    let e = Maps.entries[key];
    if (e) { slot.replaceWith(e.el); e.map.invalidateSize(); return e; }
    const el = document.createElement('div');
    el.className = 'map';
    slot.replaceWith(el);
    // TODO(프로토타입 B): 카카오맵/네이버 지도 SDK로 교체 (배경 지도·마커·폴리라인 헬퍼만 바꾸면 됨)
    const map = L.map(el, { scrollWheelZoom: false, minZoom: 9, maxZoom: 16, preferCanvas: false }).setView([37.24, 127.08], 11);
    BaseMap.addTo(map);
    map.on('click', (ev) => { map.scrollWheelZoom.enable(); App.current?.onMapClick?.(key, ev.latlng); });
    map.on('mouseout', () => map.scrollWheelZoom.disable());
    e = Maps.entries[key] = { el, map, layer: L.layerGroup().addTo(map), trucks: {}, fitKey: null, pendingFit: null };
    // 지도 크기가 0인 상태(숨겨진 탭·패널)에서 화면 맞춤을 하면 확대 수준이 틀어지므로, 크기가 잡힐 때 적용
    if ('ResizeObserver' in window) new ResizeObserver(() => { map.invalidateSize(); Maps.applyFit(e); }).observe(el);
    return e;
  },
  /** 점들이 모두 보이도록 맞춤 (크기가 없으면 보류) */
  fit(e, pts, maxZoom = 13) { e.pendingFit = { pts, maxZoom }; Maps.applyFit(e); },
  applyFit(e) {
    const s = e.map.getSize();
    if (!e.pendingFit || s.x < 50 || s.y < 50) return;
    const { pts, maxZoom } = e.pendingFit;
    e.pendingFit = null;
    if (pts.length > 1) e.map.fitBounds(pts, { padding: [36, 36], maxZoom });
    else if (pts.length) e.map.setView(pts[0], maxZoom);
  },
};
/**
 * 배경 지도 — data/mapdata.js 의 주요 도로·하천·지명을 벡터로 그린다 (타일 서버 불필요).
 * 도로 등급별로 한 덩어리(멀티 폴리라인)씩 캔버스에 그려 가볍게 유지.
 */
const BaseMap = {
  decoded: null,
  data() { // 좌표 해독은 한 번만 (레이어는 지도마다 새로 만들어야 함)
    if (!BaseMap.decoded && MAP_DATA) {
      const lines = (arr) => (arr || []).map((s) => decodePolyline(s));
      const R = MAP_DATA.roads || {};
      BaseMap.decoded = {
        rivers: lines(MAP_DATA.rivers),
        roads: { secondary: lines(R.secondary), primary: lines(R.primary), trunk: lines(R.trunk), motorway: lines(R.motorway) },
        places: MAP_DATA.places || [],
      };
    }
    return BaseMap.decoded;
  },
  addTo(map) {
    map.getContainer().style.background = 'var(--map-land)';
    map.attributionControl.setPrefix(false);
    map.attributionControl.addAttribution(MAP_DATA ? '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자 · 경로 OSRM' : '배경 지도 데이터 없음');
    const D = BaseMap.data();
    if (!D) return;
    const css = getComputedStyle(document.documentElement);
    const color = (name) => css.getPropertyValue(name).trim();
    const renderer = L.canvas({ padding: 0.3 });
    const base = { renderer, opacity: 1, interactive: false, lineCap: 'round', lineJoin: 'round' };
    const road = (key, fill, w) => [
      L.polyline(D.roads[key], { ...base, color: color('--map-road-edge'), weight: w + 1.5 }),
      L.polyline(D.roads[key], { ...base, color: fill, weight: w }),
    ];
    L.layerGroup([
      L.polyline(D.rivers, { ...base, color: color('--map-water'), weight: 3 }),
      ...road('secondary', color('--map-road'), 2),
      ...road('primary', color('--map-primary'), 3),
      ...road('trunk', color('--map-trunk'), 3.5),
      ...road('motorway', color('--map-motorway'), 4),
    ]).addTo(map);
    // 지명: 시(city)는 항상, 읍·면(town)은 확대했을 때만
    const label = ([name, lat, lng, kind]) => L.marker([lat, lng], {
      icon: L.divIcon({ className: 'mk', html: `<div class="mk-place ${kind}">${esc(name)}</div>`, iconSize: [0, 0] }),
      interactive: false, keyboard: false, zIndexOffset: -1000,
    });
    L.layerGroup(D.places.filter((x) => x[3] === 'city').map(label)).addTo(map);
    const towns = L.layerGroup(D.places.filter((x) => x[3] !== 'city').map(label));
    const sync = () => { if (map.getZoom() >= 12) towns.addTo(map); else towns.remove(); };
    map.on('zoomend', sync);
    sync();
  },
};
const mkIcon = (html) => L.divIcon({ className: 'mk', html, iconSize: [0, 0] });
const siteIcon = (name) => mkIcon(`<div class="mk-site">🏗 ${esc(name.length > 12 ? name.slice(0, 12) + '…' : name)}</div>`);
const plantIcon = (cls, text) => mkIcon(`<div class="mk-plant ${cls}">${esc(text)}</div>`);
const truckIcon = (d, phase) => mkIcon(`<div class="mk-truck ph-${phase}">${ICON.mixer}<b>${d.truckNo}호</b></div>`);

/** 배송 지도(현장 추적 / 공급자 배차 공용): 공장·현장, 이동 경로(지나온 길·남은 길), 차량 */
const ROUTE_COLOR = '#1f5fbf', ROUTE_DONE_COLOR = '#3a404b';
const DeliveryMap = {
  draw(e, items, ctx, now, focus = {}) {
    e.layer.clearLayers();
    e.trucks = {};
    const siteIds = new Set([...items.map((d) => d.siteId), ...(focus.sites || [])]);
    const plantIds = new Set([...items.map((d) => d.plantId), ...(focus.plants || [])]);
    const pts = [];
    for (const id of siteIds) {
      const s = ctx.site[id]; if (!s) continue;
      L.marker([s.lat, s.lng], { icon: siteIcon(s.name), zIndexOffset: 500 }).addTo(e.layer); pts.push([s.lat, s.lng]);
    }
    for (const id of plantIds) {
      const p = ctx.plant[id]; if (!p) continue;
      L.marker([p.lat, p.lng], { icon: plantIcon('plain', p.name) }).addTo(e.layer); pts.push([p.lat, p.lng]);
    }
    const line = { interactive: false, lineCap: 'round', lineJoin: 'round' };
    for (const d of items) {
      L.polyline(d.path, { ...line, color: '#ffffff', weight: 11, opacity: 0.95 }).addTo(e.layer);            // 테두리
      const done = L.polyline([], { ...line, color: ROUTE_DONE_COLOR, weight: 4, opacity: 0.9, dashArray: '2 7' }).addTo(e.layer); // 지나온 길
      const rest = L.polyline(d.path, { ...line, color: ROUTE_COLOR, weight: 6, opacity: 1 }).addTo(e.layer);   // 남은 길
      const marker = L.marker(d.path[0], { icon: truckIcon(d, DeliveryRules.phase(d, now)), zIndexOffset: 1000 })
        .bindTooltip(`${d.truckNo}호차 · ${d.plateNo} · 경로 ${d.distanceKm}km`, { direction: 'top', offset: [0, -18] }).addTo(e.layer);
      e.trucks[d.id] = { marker, done, rest };
      for (const p of d.path) pts.push(p);
    }
    const key = [...siteIds, ...plantIds, ...items.map((d) => d.id)].join(',');
    if (e.fitKey !== key) { e.fitKey = key; Maps.fit(e, pts, pts.length > 1 ? 14 : 13); }
    return DeliveryMap.move(e, items, now);
  },
  /** 차량 위치를 옮기고 경로를 '지나온 길 / 남은 길'로 나눠 다시 그린다. 배송별 위치 정보(ETA 포함)를 돌려준다 */
  async move(e, items, now) {
    const out = {};
    for (const d of items) {
      const pos = await TrackingService.getPosition(d, now);
      out[d.id] = pos;
      const t = e?.trucks?.[d.id];
      if (!t) continue;
      const here = [pos.lat, pos.lng];
      t.marker.setLatLng(here);
      t.done.setLatLngs([...d.path.slice(0, pos.index + 1), here]);
      t.rest.setLatLngs([here, ...d.path.slice(pos.index + 1)]);
    }
    return out;
  },
};
/** 진행 중 배송 화면 공통: 지도·카드의 실시간 값(위치·ETA·남은 시간) 갱신 */
async function updateLiveDeliveries(items, mapE, now) {
  const pos = await DeliveryMap.move(mapE, items, now);
  for (const d of items) {
    const el = document.querySelector(`[data-dlv="${d.id}"]`);
    if (el) updateDeliveryLive(el, d, now, pos[d.id]);
    notifyEtaDrift(d, pos[d.id]);
  }
}
/** 도착 예정이 처음 예상보다 5분 이상 달라지면 한 번 알림 */
function notifyEtaDrift(d, pos) {
  if (!pos || d.completedAt || !d.etaInitialAt || Live.etaNotified.has(d.id)) return;
  if (DeliveryRules.phase(d, pos.at) !== 'transit') return;
  const diff = Math.floor(pos.etaAt / MIN) - Math.floor(d.etaInitialAt / MIN);
  if (Math.abs(diff) < 5 || !(ui.role === 'buyer' || d.plantId === ui.plantId)) return;
  Live.etaNotified.add(d.id);
  toast(`${d.truckNo}호차 도착 예정 ${fmtTime(pos.etaAt)} — 처음 예상보다 ${Math.abs(diff)}분 ${diff > 0 ? '늦어짐 (교통 정체)' : '빨라짐'}`, diff > 0 ? 'warn' : 'info');
}

/** 매초 갱신: 경과시간·남은 시간·실시간 도착 예정(ETA). pos = TrackingService.getPosition 결과 */
function updateDeliveryLive(el, d, now, pos) {
  const phase = DeliveryRules.phase(d, now);
  const eta = pos?.etaAt ?? (now >= d.arriveAt ? d.arriveAt : d.etaInitialAt ?? d.arriveAt);
  const elapsed = (d.completedAt ?? now) - d.mixStartAt;
  const remain = d.limitAt - now;
  const limitMs = d.limitMinutes * MIN;
  const q = (k) => el.querySelector(`[data-live="${k}"]`);
  const set = (k, v) => { const x = q(k); if (x && x.textContent !== v) x.textContent = v; };
  const bar = q('bar');
  if (bar) bar.style.width = `${clamp((elapsed / limitMs) * 100, 0, 100)}%`;
  const mark = q('mark');
  if (mark) mark.style.left = `${clamp(((eta - d.mixStartAt) / limitMs) * 100, 0, 100)}%`;
  const box = el.querySelector('.limit');
  if (box) box.className = `limit lv-${DeliveryRules.limitLevel(d, now, eta)}`;
  set('elapsed', fmtDur(elapsed));
  set('remain', d.completedAt ? (DeliveryRules.withinLimit(d) ? '제한시간 내 완료' : '제한시간 초과') : remain >= 0 ? `기한까지 ${fmtDur(remain)}` : `기한 ${fmtDur(remain)} 초과`);
  // 도착 예정: 분 단위가 바뀌면 잠깐 강조
  const etaText = fmtTime(eta);
  const etaEl = q('eta-time');
  if (etaEl && etaEl.textContent !== etaText) {
    if (etaEl.textContent && phase === 'transit') { etaEl.classList.remove('flash'); void etaEl.offsetWidth; etaEl.classList.add('flash'); }
    etaEl.textContent = etaText;
  }
  set('eta-step', etaText);
  const mins = (ms) => Math.max(1, Math.ceil(ms / MIN));
  set('eta',
    phase === 'loading' ? `상차 중 · ${mins(d.departAt - now)}분 후 출발`
    : phase === 'transit' ? `약 ${mins(eta - now)}분 남음 · ${Math.round((pos?.progress ?? 0) * 100)}% 이동`
    : phase === 'onsite' ? (now - d.arriveAt > UNLOAD_EST_MIN * MIN ? `도착 ${Math.floor((now - d.arriveAt) / MIN)}분 경과 · 완료 확인 필요` : '현장 도착 · 타설 중')
    : `타설 완료 ${fmtTime(d.completedAt)}`);
  const diffEl = q('eta-diff');
  if (diffEl && d.etaInitialAt) {
    const diff = Math.floor(eta / MIN) - Math.floor(d.etaInitialAt / MIN); // 화면에 보이는 '분' 기준으로 비교
    diffEl.hidden = phase === 'loading' || phase === 'done';
    diffEl.className = `pill tone-${diff >= 3 ? 'warn' : diff <= -3 ? 'ok' : 'muted'}`;
    const text = diff === 0 ? '처음 예상대로' : `처음 예상보다 ${Math.abs(diff)}분 ${diff > 0 ? '늦음' : '빠름'}`;
    if (diffEl.textContent !== text) diffEl.textContent = text;
  }
}

function deliveryRowsHtml(dls, now) {
  return `<ul class="dl-rows">${dls.map((d) => {
    const ph = DeliveryRules.phase(d, now), within = DeliveryRules.withinLimit(d);
    const took = d.completedAt ? ` · ${Math.round((d.completedAt - d.mixStartAt) / MIN)}분 소요` : '';

      <span class="dl-no"><b>${d.truckNo}호차</b><small>${esc(d.plateNo)}</small></span>
      <span>${d.volume}m³ · ${fmtTime(d.mixStartAt)} 출하${took}</span>
