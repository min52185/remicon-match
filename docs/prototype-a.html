      <button type="button" class="btn sm" data-act="note" data-id="${d.id}">납품서</button>
    </li>`;
  }).join('')}</ul>`;
}

function orderCardHtml(o, ctx, now, role) {
  const plant = ctx.plant[o.plantId] || {}, site = ctx.site[o.siteId] || {};
  const dls = ctx.deliveries.filter((d) => d.orderId === o.id);
  const shipped = sum(dls.map((d) => d.volume)), done = sum(dls.filter((d) => d.completedAt).map((d) => d.volume));
  const p = o.plan, loads = Math.ceil(o.volume / TRUCK_CAPACITY_M3);
  const tj = PourRules.judgeTravel(p.travelMinutes, p.allowedTravelMinutes);
  let extra = '', actions = '';
  if (role === 'buyer' && o.status === 'requested') {
    actions = `<button type="button" class="btn danger sm" data-act="cancel" data-id="${o.id}">주문 취소</button>`;
  }
  if (role === 'supplier' && o.status === 'requested') {
    const sj = PourRules.judgeSpec(plant, o.spec);
    const checks = [
      { lv: tj.level, t: `운반 ${p.travelMinutes}분 / 허용 ${p.allowedTravelMinutes}분 (외기 ${p.tempC}℃ → 제한 ${p.limitMinutes}분 기준)` },
      { lv: sj.level, t: sj.level === 'ok' ? `사양 생산 가능 (${specText(o.spec)} · ${cementShort(o.spec.cement)})` : `생산 불가: ${sj.label}` },
      ...(isKsSpec(o.spec) ? [] : [{ lv: 'warn', t: 'KS F 4009 표에 없는 조합 — 현장과 협의 필요' }]),
      { lv: plant.availableVolume >= o.volume ? 'ok' : plant.availableVolume > 0 ? 'warn' : 'bad', t: `출하 가능 물량 ${plant.availableVolume}m³ / 주문 ${o.volume}m³` },
      { lv: plant.availableTrucks > 0 ? 'ok' : 'bad', t: `출하 가능 차량 ${plant.availableTrucks}대 · 총 ${loads}회 운반 필요` },
    ];
    extra = `<ul class="checks">${checks.map((c) => `<li class="lv-${c.lv}">${esc(c.t)}</li>`).join('')}</ul>`;
    actions = `<button type="button" class="btn danger" data-act="reject" data-id="${o.id}">거절</button>
               <button type="button" class="btn primary" data-act="accept" data-id="${o.id}">수락</button>`;
  }
  if (role === 'supplier' && ['accepted', 'delivering'].includes(o.status) && shipped < o.volume) {
    actions = `<button type="button" class="btn dark sm" data-act="goDispatch">배차하러 가기 →</button>`;
  }
  return `
  <article class="card order" data-order="${o.id}">
    <header class="order-head">
      <div><span class="mono">${esc(o.no)}</span><span class="pill tone-${ORDER_TONE[o.status]}">${ORDER_STATUS[o.status]}</span></div>
      <span class="muted sm">${fmtAgo(o.requestedAt, now)} 요청</span>
    </header>
    <p class="order-route">${role === 'supplier'
      ? `<b>${esc(site.name)}</b> <span class="muted sm">· ${esc(site.address)}</span>`
      : `<b>${esc(plant.name)}</b> → ${esc(site.name)}`}</p>
    <dl class="kv">
      <div><dt>콘크리트</dt><dd>${esc(specText(o.spec))}<small>${esc(slumpLabel(o.spec))} · ${esc(cementShort(o.spec.cement))}</small></dd></div>
      <div><dt>물량</dt><dd>${o.volume}m³ <small>${loads}회 운반분</small></dd></div>
      <div><dt>타설 희망</dt><dd>${fmtDateTime(o.pourAt)}</dd></div>
      <div><dt>시간 판정</dt><dd><span class="txt-${tj.level}">이동 ${p.travelMinutes}분 / 허용 ${p.allowedTravelMinutes}분</span><small>외기 ${p.tempC}℃${p.tempManual ? '(직접 입력)' : ''} → 제한 ${p.limitMinutes}분</small></dd></div>
    </dl>
    ${o.note ? `<p class="note">요청사항: ${esc(o.note)}</p>` : ''}
    ${o.status === 'rejected' ? `<p class="alert bad">거절 사유: ${esc(o.rejectReason || '-')}</p>` : ''}
    ${extra}
    ${dls.length || ['accepted', 'delivering', 'completed'].includes(o.status) ? progressHtml(o.volume, shipped, done) : ''}
    ${dls.length ? deliveryRowsHtml(dls, now) : ''}
    ${actions ? `<div class="actions">${actions}</div>` : ''}
  </article>`;
}

            <label class="field"><span class="lbl">타설 예정 시각</span><input id="f-pour" type="datetime-local" value="${toLocalInput(ui.pourAt)}"></label>
            <label class="field"><span class="lbl">물량 <small>직접 입력</small></span><span class="unit-input"><input id="f-volume" type="number" inputmode="decimal" min="1" step="0.5" value="${ui.volume}"><em>m³</em></span></label>
          </div>
          <div class="temp-row">
            <span class="lbl">외기온도</span>
            <span class="unit-input"><input id="f-temp" type="number" step="0.1" inputmode="decimal" aria-label="외기온도"><em>℃</em></span>
            <span class="src" id="temp-src"></span>
            <button type="button" class="linkbtn" id="f-temp-reset" hidden>예보값으로</button>
          </div>
          <div id="cond-summary" class="rule"></div>
          <details class="settings-box" id="settings-box" ${ui.settingsOpen ? 'open' : ''}>
            <summary>여유시간 설정 <span id="settings-sum"></span></summary>
            <div class="grid-2">
              <label class="field"><span class="lbl">출하 준비시간</span><span class="unit-input"><input id="f-prep" type="number" inputmode="numeric" min="0" max="60" step="1" value="${settings.prepMinutes}"><em>분</em></span></label>
              <label class="field"><span class="lbl">현장 대기·타설 여유</span><span class="unit-input"><input id="f-buffer" type="number" inputmode="numeric" min="0" max="90" step="1" value="${settings.siteBufferMinutes}"><em>분</em></span></label>
            </div>
            <button type="button" class="btn ghost sm" id="f-reset-settings">기본값으로 (${RULES.DEFAULT_PREP_MIN}분 / ${RULES.DEFAULT_SITE_BUFFER_MIN}분)</button>
          </details>
        </div>
        <div class="map-card">
          <div data-map-slot></div>
          <div class="map-hint" id="pick-hint" hidden>지도를 눌러 현장 위치를 지정하세요 <button type="button" class="btn sm ghost" id="pick-cancel">취소</button></div>
          <div class="map-legend"><span><i class="dot lv-ok"></i>주문 가능</span><span><i class="dot lv-warn"></i>확인 필요</span><span><i class="dot" style="--c:#9aa1ad"></i>주문 불가</span><span><i class="route-swatch"></i>공장을 누르면 도로 경로 표시</span></div>
        </div>
      </div>
      <div class="col">
        <div class="list-head">
          <h2>레미콘 공장<small id="res-count"></small></h2>
          <div class="list-tools">
            <select id="f-sort" aria-label="정렬">
              <option value="travel" ${ui.sort === 'travel' ? 'selected' : ''}>이동시간순</option>
              <option value="volume" ${ui.sort === 'volume' ? 'selected' : ''}>출하 가능 물량순</option>
              <option value="trucks" ${ui.sort === 'trucks' ? 'selected' : ''}>가용 차량순</option>
            </select>
            <label class="check"><input type="checkbox" id="f-only" ${ui.onlyAvailable ? 'checked' : ''}>주문 가능만</label>
          </div>
        </div>
        <div id="plant-list" class="plant-list"></div>
      </div>
    </section>`;
    this.bind(root);
    this.mapE = Maps.mount('search', $('[data-map-slot]', root));
    await this.refresh({ fit: true });
  },

  bind(root) {
    const on = (id, ev, fn) => $(id, root).addEventListener(ev, fn);
    const refresh = () => { saveUi(); this.refresh(); };
    on('#f-site', 'change', (e) => {
      if (e.target.value === '__pick') return this.startPick();
      ui.siteId = e.target.value; this.stopPick(); saveUi(); this.refresh({ fit: true });
    });
    on('#f-pour', 'change', (e) => { const ts = fromLocalInput(e.target.value); if (ts) { ui.pourAt = ts; refresh(); } });
    on('#f-spec-btn', 'click', () => openSpecSheet());
    on('#f-volume', 'input', debounce((e) => { const v = parseFloat(e.target.value); if (v > 0) { ui.volume = v; refresh(); } }, 350));
    on('#f-temp', 'input', debounce((e) => {
      const v = parseFloat(e.target.value);
      ui.tempOverride = Number.isFinite(v) ? clamp(v, -30, 50) : null; refresh();
    }, 400));
    on('#f-temp-reset', 'click', () => { ui.tempOverride = null; refresh(); });
    const saveSettings = debounce(() => {
      const prep = parseInt($('#f-prep').value, 10), buffer = parseInt($('#f-buffer').value, 10);
      if (!(prep >= 0 && prep <= 60)) return toast('출하 준비시간은 0~60분으로 입력하세요', 'warn');
      if (!(buffer >= 0 && buffer <= 90)) return toast('현장 대기·타설 여유는 0~90분으로 입력하세요', 'warn');
      Store.updateSettings({ prepMinutes: prep, siteBufferMinutes: buffer }); // 저장 알림 → onStoreChange → 재계산
    }, 400);
    on('#f-prep', 'input', saveSettings);
    on('#f-buffer', 'input', saveSettings);
    on('#f-reset-settings', 'click', () => {
      $('#f-prep').value = RULES.DEFAULT_PREP_MIN; $('#f-buffer').value = RULES.DEFAULT_SITE_BUFFER_MIN;
      Store.updateSettings({ prepMinutes: RULES.DEFAULT_PREP_MIN, siteBufferMinutes: RULES.DEFAULT_SITE_BUFFER_MIN });
    });
    on('#settings-box', 'toggle', (e) => { ui.settingsOpen = e.target.open; saveUi(); });
    on('#f-sort', 'change', (e) => { ui.sort = e.target.value; saveUi(); this.paintList(); });
    on('#f-only', 'change', (e) => { ui.onlyAvailable = e.target.checked; saveUi(); this.paintList(); });
    on('#pick-cancel', 'click', () => this.stopPick());
    on('#plant-list', 'click', (e) => {
      if (e.target.closest('button')) return;
      const card = e.target.closest('.plant-card');
      if (card) this.focusPlant(card.dataset.plant);
    });
  },

  startPick() {
    this.picking = true;
    $('#pick-hint').hidden = false;
    $('.map-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  stopPick() {
    this.picking = false;
    const hint = $('#pick-hint'); if (hint) hint.hidden = true;
    const sel = $('#f-site'); if (sel) sel.value = ui.siteId;
  },
  async onMapClick(key, latlng) {
    if (key !== 'search' || !this.picking) return;
    this.picking = false;
    // TODO(프로토타입 B): 좌표 → 주소 변환(카카오 coord2address)으로 주소 채우기
    await Store.upsertSite({ id: 'custom', name: '직접 지정 위치', address: `위도 ${latlng.lat.toFixed(4)}, 경도 ${latlng.lng.toFixed(4)}`, lat: latlng.lat, lng: latlng.lng });
    ui.siteId = 'custom'; saveUi();
    toast('현장 위치를 지정했습니다', 'ok');
    App.render();
  },
  onStoreChange() { this.refresh(); },

  async refresh({ fit = false } = {}) {
    const token = ++this.token;
    const [site, settings] = await Promise.all([Store.getSite(ui.siteId), Store.getSettings()]);
    if (!site) return;
    const res = await SearchService.searchPlants({ site, pourAt: ui.pourAt, volume: ui.volume, spec: ui.spec, settings, tempOverride: ui.tempOverride });
    if (token !== this.token || App.current !== this) return;
    this.last = { site, settings, res };
    this.paintConditions();
    this.paintList();
    this.paintMap(fit);
  },

  paintConditions() {
    const { res, settings: s } = this.last;
    const L_ = res.limitMinutes, A = res.allowedTravelMinutes, hot = PourRules.isHot(res.tempC);
    $('#f-spec-text').textContent = specText(ui.spec);
    $('#f-spec-sub').textContent = `골재 ${ui.spec.aggMm}mm · ${strengthLabel(ui.spec)} · ${slumpLabel(ui.spec)} · ${cementShort(ui.spec.cement)}`;
    const temp = $('#f-temp');
    if (temp && document.activeElement !== temp) temp.value = res.tempC;
    $('#temp-src').textContent = res.isManualTemp ? '직접 입력값' : `${fmtTime(ui.pourAt)} 예보 · 목업`;
    $('#f-temp-reset').hidden = !res.isManualTemp;
    for (const [id, v] of [['#f-prep', s.prepMinutes], ['#f-buffer', s.siteBufferMinutes]]) {
      const el = $(id); if (el && document.activeElement !== el) el.value = v;
    }
    $('#settings-sum').textContent = `출하 준비 ${s.prepMinutes}분 · 현장 대기·타설 ${s.siteBufferMinutes}분`;
    const seg = (cls, v, text) => `<span class="${cls}" style="flex:${Math.max(v, 0)} 1 0%">${v > 0 ? text : ''}</span>`;
    $('#cond-summary').innerHTML = `
      <div class="rule-head">
        <span class="pill tone-${hot ? 'bad' : 'info'}">${hot ? `${RULES.HOT_THRESHOLD_C}℃ 이상 · 고온 기준` : `${RULES.HOT_THRESHOLD_C}℃ 미만 · 일반 기준`}</span>
        <span>비비기 ~ 타설 완료 제한<b>${L_}분</b></span>
      </div>
      <div class="budget" role="img" aria-label="제한 ${L_}분 = 준비 ${s.prepMinutes}분 + 이동 ${Math.max(A, 0)}분 + 현장 ${s.siteBufferMinutes}분">
        ${seg('prep', s.prepMinutes, s.prepMinutes)}${seg('travel', A, `이동 ≤ ${A}분`)}${seg('buffer', s.siteBufferMinutes, s.siteBufferMinutes)}
      </div>
      <div class="budget-legend"><span><i style="background:#8a94a6"></i>출하 준비</span><span><i style="background:var(--accent)"></i>허용 이동</span><span><i style="background:#4b5566"></i>현장 대기·타설</span></div>
      <p class="formula">허용 이동시간 = ${L_} − 출하 준비 ${s.prepMinutes} − 현장 대기·타설 ${s.siteBufferMinutes} = <b>${A}분</b></p>
      ${A <= 0 ? '<p class="alert bad">여유시간 합계가 제한시간 이상입니다. 여유시간 설정을 줄여 주세요.</p>' : ''}`;
  },

  paintList() {
    if (!this.last) return;
    const { res } = this.last;
    const now = SimClock.now();
    const sorters = {
      travel: (a, b) => a.travel.minutes - b.travel.minutes,
      volume: (a, b) => b.plant.availableVolume - a.plant.availableVolume,
      trucks: (a, b) => b.plant.availableTrucks - a.plant.availableTrucks,
    };
    // 주문 가능 → 확인 필요 → 불가 순으로 묶고, 그 안에서 선택한 기준으로 정렬
    let items = res.results.slice().sort((a, b) => LEVEL_RANK[a.level] - LEVEL_RANK[b.level] || sorters[ui.sort](a, b));
    const okN = items.filter((r) => r.level !== 'bad').length;
    if (ui.onlyAvailable) items = items.filter((r) => r.level !== 'bad');
    $('#res-count').textContent = `주문 가능 ${okN}곳 / 전체 ${res.results.length}곳`;
    $('#plant-list').innerHTML = items.length
      ? items.map((r) => this.cardHtml(r, res, now)).join('')
      : emptyHtml('조건에 맞는 공장이 없습니다', '타설 시각·규격·물량이나 여유시간 설정을 바꿔 보세요.');
  },

  cardHtml(r, res, now) {
    const p = r.plant, A = res.allowedTravelMinutes, tj = r.travelJudge;
    const pct = A > 0 ? clamp((r.travel.minutes / A) * 100, 0, 100) : 100;
    const stale = now - p.updatedAt > 60 * MIN;
    const travelText = tj.margin >= 0 ? `허용 ${A}분 중 ${r.travel.minutes}분 · 여유 ${tj.margin}분` : `허용 ${A}분보다 ${-tj.margin}분 더 걸림`;
    return `
    <article class="plant-card lv-${r.level}" data-plant="${p.id}">
      <div class="pc-top">
        <div><h3>${esc(p.name)}</h3><p>${esc(p.address)} · 도로 약 ${r.travel.distanceKm}km</p></div>
        <span class="pill tone-${r.level}">${LEVEL_LABEL[r.level]}</span>
      </div>
      <div class="metrics">
        <div class="m"><span class="k">예상 이동</span><span class="v">${r.travel.minutes}<small>분</small></span></div>
        <div class="m"><span class="k">가용 차량</span><span class="v">${p.availableTrucks}<small>/${p.fleetSize}대</small></span></div>
        <div class="m"><span class="k">출하 가능</span><span class="v">${p.availableVolume}<small>m³</small></span></div>
      </div>
      <div class="meter lv-${tj.level}"><div class="bar"><i style="width:${pct}%"></i></div><span>${travelText}</span></div>
      <div class="pc-foot">
        <div class="chips"><span class="pill tone-${tj.level}">${tj.label}</span><span class="pill tone-${r.supplyJudge.level}">${esc(r.supplyJudge.label)}</span></div>
        <span class="upd ${stale ? 'stale' : ''}">출하 정보 ${fmtAgo(p.updatedAt, now)} 갱신</span>
      </div>
      <button type="button" class="btn ${r.level === 'bad' ? '' : 'primary'} block" data-act="order" data-id="${p.id}" ${r.level === 'bad' ? 'disabled' : ''}>${r.level === 'bad' ? '주문 불가' : '이 공장에 주문하기'}</button>
    </article>`;
  },

  paintMap(fit) {
    const e = this.mapE;
    if (!e || !this.last) return;
    const { site, res } = this.last;
    e.layer.clearLayers();
    this.markers = {};
    this.routeLayer = L.layerGroup().addTo(e.layer);
    L.marker([site.lat, site.lng], { icon: siteIcon(site.name), zIndexOffset: 1000 }).addTo(e.layer);
    for (const r of res.results) {
      const m = L.marker([r.plant.lat, r.plant.lng], { icon: plantIcon(`lv-${r.level}`, `${r.travel.minutes}분`), zIndexOffset: r.level === 'bad' ? 0 : 200 })
        .bindPopup(`<b>${esc(r.plant.name)}</b><br>이동 ${r.travel.minutes}분 · ${LEVEL_LABEL[r.level]}`)
        .addTo(e.layer);
      m.on('click', () => { this.highlight(r.plant.id, true); this.showRoute(r); });
      this.markers[r.plant.id] = m;
    }
    if (fit) Maps.fit(e, [[site.lat, site.lng], ...res.results.map((r) => [r.plant.lat, r.plant.lng])]);
  },
  highlight(id, scroll) {
    $$('.plant-card.is-hl').forEach((el) => el.classList.remove('is-hl'));
    const el = $(`.plant-card[data-plant="${id}"]`);
    if (!el) return;
    el.classList.add('is-hl');
    if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  /** 공장 → 현장 도로 경로 미리보기 */
  showRoute(r) {
    if (!this.routeLayer) return;
    this.routeLayer.clearLayers();
    const line = { interactive: false, lineCap: 'round', lineJoin: 'round' };
    L.polyline(r.travel.path, { ...line, color: '#ffffff', weight: 9, opacity: 0.95 }).addTo(this.routeLayer);
    L.polyline(r.travel.path, { ...line, color: ROUTE_COLOR, weight: 5, opacity: 0.9, dashArray: r.travel.source === 'mock' ? '8 8' : null }).addTo(this.routeLayer);
    return r.travel.path;
  },
  focusPlant(id) {
    const m = this.markers[id];
    const r = this.last?.res.results.find((x) => x.plant.id === id);
    this.highlight(id, false);
    if (!m || !this.mapE || !r) return;
    const path = this.showRoute(r);
    this.mapE.map.fitBounds(path, { padding: [36, 36], maxZoom: 14 });
    m.openPopup();
  },
  actions: { order(b) { openOrderSheet(b.dataset.id); } },
};

/** 주문 시트 */
function openOrderSheet(plantId) {
  const last = SearchView.last;
  const r = last?.res.results.find((x) => x.plant.id === plantId);
  if (!r) return;
  const { site, res } = last, p = r.plant;
  let spec = { ...ui.spec };
  Modal.open({
    title: '주문 요청',
    body: `
      <div class="sheet-route">
        <div><span class="k">공급 공장</span><b>${esc(p.name)}</b></div>
        <div><span class="k">납품 현장</span><b>${esc(site.name)}</b></div>
      </div>
      <form class="form" id="order-form" novalidate>
        <label class="field"><span class="lbl">물량 <small>직접 입력</small></span><span class="unit-input"><input id="of-volume" name="volume" type="number" inputmode="decimal" min="0.5" step="0.5" value="${ui.volume}"><em>m³</em></span></label>
        <div class="spec-form" id="of-spec"></div>
        <div class="grid-2">
          <label class="field span-2"><span class="lbl">타설 시작 희망 시각</span><input id="of-pour" name="pourAt" type="datetime-local" value="${toLocalInput(ui.pourAt)}"></label>
          <label class="field span-2"><span class="lbl">요청사항 <small>선택</small></span><textarea id="of-note" name="note" rows="2" maxlength="200" placeholder="예) 펌프카 09:30 도착 예정, 2층 슬래브 타설"></textarea></label>
        </div>
        <ul class="checks" id="order-checks"></ul>
        <p class="sm muted">주문하는 순간의 외기온도·이동시간으로 판정 기준을 다시 계산해 주문과 함께 저장합니다.</p>
      </form>`,
    actions: [
      { label: '취소', kind: 'ghost' },
      {
        label: '주문 요청 보내기', kind: 'primary',
        async onClick(api) {
          const form = api.el.querySelector('#order-form');
          const { spec: s, error } = SpecForm.read(form, 'of');
          const volume = parseFloat(form.volume.value), pourAt = fromLocalInput(form.pourAt.value);
          if (!(volume > 0 && volume <= 2000)) { toast('물량을 0.5~2000m³ 사이로 입력하세요', 'warn'); return false; }
          if (error) { toast(error, 'warn'); return false; }
          const sj = PourRules.judgeSpec(p, s);
          if (sj.level === 'bad') { toast(`${p.name}에서 만들 수 없는 사양입니다 — ${sj.label}`, 'warn'); return false; }
          if (!pourAt) { toast('타설 희망 시각을 입력하세요', 'warn'); return false; }
          if (pourAt < SimClock.now()) { toast('타설 희망 시각이 이미 지났습니다', 'warn'); return false; }
          const order = await OrderService.create({
            site, plant: p, spec: s, volume, pourAt, note: String(form.note.value || '').trim(),
            settings: await Store.getSettings(), tempOverride: ui.tempOverride,
          });
          ui.spec = s; ui.volume = volume; saveUi();
          toast(`${order.no} 주문 요청을 보냈습니다. 레미콘사 수락을 기다립니다.`, 'ok');
          App.go(null, 'orders');
        },
      },
    ],
    onMount(api) {
      const form = api.el.querySelector('#order-form');
      const paint = () => {
        const vol = parseFloat(form.volume.value) || 0;
        const sj = spec ? PourRules.judgeSupply(p, vol, spec) : { level: 'bad', label: '사양 입력을 확인하세요' };
        const checks = [
          { lv: r.travelJudge.level, t: `예상 이동 ${r.travel.minutes}분 / 허용 ${res.allowedTravelMinutes}분 (외기 ${res.tempC}℃ → 제한 ${res.limitMinutes}분)` },
          { lv: sj.level, t: `${sj.label} · 출하 가능 ${p.availableVolume}m³, 가용 차량 ${p.availableTrucks}대` },
          { lv: 'info', t: `약 ${Math.ceil(vol / TRUCK_CAPACITY_M3)}회 운반 (1대 ${TRUCK_CAPACITY_M3}m³ 기준)` },
        ];
        form.querySelector('#order-checks').innerHTML = checks.map((c) => `<li class="lv-${c.lv}">${esc(c.t)}</li>`).join('');
      };
      SpecForm.mount(form.querySelector('#of-spec'), spec, 'of', (s) => { spec = s; paint(); });
      form.volume.addEventListener('input', paint);
      paint();
    },
  });
}

/** 검색 조건의 콘크리트 사양 변경 */
function openSpecSheet() {
  Modal.open({
    title: '콘크리트 사양',
    body: '<div class="spec-form" id="ss-spec"></div><p class="sm muted" style="margin-top:10px">이 사양을 만들 수 있는 공장만 "주문 가능"으로 표시됩니다.</p>',
    actions: [
      { label: '취소', kind: 'ghost' },
      {
        label: '적용', kind: 'primary',
        onClick(api) {
          const { spec, error } = SpecForm.read(api.el, 'ss');
          if (error) { toast(error, 'warn'); return false; }
          ui.spec = spec; saveUi();
          SearchView.refresh();
        },
      },
    ],
    onMount(api) { SpecForm.mount(api.el.querySelector('#ss-spec'), ui.spec, 'ss'); },
  });
}

/* ---- 6-7. [현장] 배송 추적 ---- */
const TrackingView = {
  live: true, items: [], mapE: null,
  async render(root, t) {
    const now = SimClock.now();
    const ctx = await loadCtx();
    if (App.stale(t)) return;
    const active = ctx.deliveries.filter((d) => DeliveryRules.phase(d, now) !== 'done');
    const waiting = ctx.orders.filter((o) => ['accepted', 'delivering'].includes(o.status) && remainingOf(o, ctx.deliveries) > 0);
    const recent = ctx.deliveries.filter((d) => d.completedAt && now - d.completedAt < 12 * 60 * MIN).sort((a, b) => b.completedAt - a.completedAt).slice(0, 5);
    this.items = active;
    root.innerHTML = `
    <section class="view">
      <div class="split">
        <div class="map-card split-map">
          <div data-map-slot></div>

/* ---- 6-9. [레미콘사] 출하 현황 입력 ---- */
const StockView = {
  live: true, dirty: false,
  isDirty() { return this.dirty; },
  async render(root, t) {
    const now = SimClock.now();
    const plants = await Store.listPlants();
    const plant = pickPlant(plants);
    const [dls, sites, settings] = await Promise.all([Store.listDeliveries({ plantId: plant.id }), Store.listSites(), Store.getSettings()]);
    // 현장 화면 미리보기 (현장 탭에서 고른 현장 기준)
    const refSite = sites.find((s) => s.id === ui.siteId) || sites[0];
    const preview = await SearchService.searchPlants({ site: refSite, pourAt: Math.max(ui.pourAt || 0, now), volume: ui.volume, spec: ui.spec, settings, plantIds: [plant.id] });
    if (App.stale(t)) return;
    this.dirty = false;
    const fleet = fleetStatus(plant, dls, now);
    const idleN = fleet.filter((f) => f.state === 'idle').length;
    const siteById = indexBy(sites);
    const stepper = (label, name, value, unit, step) => `
      <label class="field"><span class="lbl">${label}</span>
        <span class="stepper"><button type="button" data-step="-${step}" aria-label="${label} 줄이기">−</button>
        <input name="${name}" type="number" inputmode="numeric" min="0" step="any" value="${value}"><em>${unit}</em>
        <button type="button" data-step="${step}" aria-label="${label} 늘리기">+</button></span>
      </label>`;
    root.innerHTML = `
    <section class="view">
      ${supplierBarHtml(plants, plant)}
      <form class="card form" id="stock-form" novalidate>
        <div class="card-head"><h2>출하 현황 입력</h2><span class="muted sm">마지막 갱신 ${fmtAgo(plant.updatedAt, now)} (${fmtTime(plant.updatedAt)})</span></div>
        <div class="field"><span class="lbl">운영 상태</span>
          <div class="seg">
            <label><input type="radio" name="isOpen" value="1" ${plant.isOpen ? 'checked' : ''}>출하 가능</label>
            <label><input type="radio" name="isOpen" value="0" ${plant.isOpen ? '' : 'checked'}>출하 중지</label>
          </div>
        </div>
        <div class="grid-3">
          ${stepper('보유 차량', 'fleetSize', plant.fleetSize, '대', 1)}
          ${stepper('출하 가능 차량', 'availableTrucks', plant.availableTrucks, '대', 1)}
          ${stepper('출하 가능 물량', 'availableVolume', plant.availableVolume, 'm³', TRUCK_CAPACITY_M3)}
        </div>
        <p class="sm muted">출하를 지시하면 가능 차량·물량이 자동으로 줄고, 차량이 복귀하면 가능 차량이 다시 늘어납니다. 언제든 직접 고칠 수 있습니다.
          배차 기록상 지금 대기 중인 차량은 <b>${idleN}대</b>입니다. <button type="button" class="linkbtn" id="use-idle">가능 차량에 반영</button></p>
        <fieldset class="field"><legend class="lbl">생산 가능 콘크리트 · 최대 호칭강도</legend>
          <div class="cap-types">${CONCRETE_TYPES.map((t) => {
            const max = plant.cap.maxStrength[t];
            return `<div class="cap-type"><label class="check"><input type="checkbox" name="types" value="${t}" ${max != null ? 'checked' : ''}>${t}</label>
              <span class="unit-input"><input type="number" name="max-${t}" inputmode="decimal" step="0.5" min="1" max="100" value="${max ?? { 포장: 4.5, 고강도: 50 }[t] ?? 30}" aria-label="${t} 최대 호칭강도"><em>MPa</em></span></div>`;
          }).join('')}</div>
        </fieldset>
        <fieldset class="field"><legend class="lbl">굵은골재 최대치수</legend>
          <div class="spec-chips">${[15, 20, 25, 40].map((v) => `<label><input type="checkbox" name="aggs" value="${v}" ${plant.cap.aggs.includes(v) ? 'checked' : ''}><span>${v}mm</span></label>`).join('')}</div>
        </fieldset>
        <label class="check"><input type="checkbox" name="flow" ${plant.cap.flow ? 'checked' : ''}>슬럼프 플로(고유동) 콘크리트 생산 가능</label>
        <fieldset class="field"><legend class="lbl">보유 시멘트</legend>
          <div class="spec-chips">${CEMENT_TYPES.map((c) => `<label><input type="checkbox" name="cements" value="${c}" ${plant.cap.cements.includes(c) ? 'checked' : ''}><span>${c}</span></label>`).join('')}</div>
        </fieldset>
        <div class="form-foot"><span class="dirty-note" id="dirty-note" hidden>저장하지 않은 변경이 있습니다</span><button type="submit" class="btn primary">저장하고 현장에 공개</button></div>
      </form>
      <div class="card">
        <div class="card-head"><h3>현장 화면 미리보기</h3><span class="muted sm">${esc(refSite.name)} 기준</span></div>
        <div class="preview-card" style="margin-top:10px">${SearchView.cardHtml(preview.results[0], preview, now)}</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>차량 현황</h3><span class="muted sm">배차 기록 기준 · 대기 ${idleN} / ${plant.fleetSize}대</span></div>
        <ul class="fleet" style="margin-top:10px">${fleet.map(({ truck, state, delivery: d }) => {
          const sName = d ? esc(siteById[d.siteId]?.name ?? '') : '';
          const detail = state === 'idle' ? '출하 대기' : state === 'loading' ? `${fmtTime(d.departAt)} 출발 예정`
            : state === 'transit' ? `${sName} · ${fmtTime(d.etaInitialAt ?? d.arriveAt)} 도착 예정` : state === 'onsite' ? `${sName} 타설 중`
            : `${fmtTime(DeliveryRules.returnAt(d))} 복귀 예정`;
          return `<li><div class="row"><b>${truck.no}호차</b><span class="pill tone-${TRUCK_TONE[state]}">${TRUCK_LABEL[state]}</span></div>
            <span class="plate">${esc(truck.plateNo)} · ${esc(truck.driver)}</span><small class="muted">${detail}</small></li>`;
        }).join('')}</ul>
      </div>
    </section>`;
    bindSupplierBar(root);
    const form = $('#stock-form', root);
    const markDirty = () => { this.dirty = true; $('#dirty-note').hidden = false; };
    form.addEventListener('input', markDirty);
    $$('[data-step]', form).forEach((b) => b.addEventListener('click', () => {
      const inp = b.parentElement.querySelector('input');
      inp.value = Math.max(0, round1((parseFloat(inp.value) || 0) + parseFloat(b.dataset.step)));
      markDirty();
    }));
    $('#use-idle', root).addEventListener('click', () => { form.availableTrucks.value = idleN; markDirty(); });
    form.addEventListener('submit', (e) => { e.preventDefault(); this.save(form, plant); });
  },
  async save(form, plant) {
    const fd = new FormData(form);
    const num = (k) => Number(fd.get(k));
    const types = fd.getAll('types');
    const capability = {
      maxStrength: Object.fromEntries(types.map((t) => [t, round1(num(`max-${t}`))])),
      aggs: fd.getAll('aggs').map(Number), flow: fd.get('flow') === 'on', cements: fd.getAll('cements'),
    };
    const data = {
      isOpen: fd.get('isOpen') === '1', fleetSize: num('fleetSize'), availableTrucks: num('availableTrucks'),
      availableVolume: round1(num('availableVolume')), cap: capability,
    };
    const err =
      !Number.isInteger(data.fleetSize) || data.fleetSize < 0 || data.fleetSize > 99 ? '보유 차량은 0~99대 정수로 입력하세요'
      : !Number.isInteger(data.availableTrucks) || data.availableTrucks < 0 ? '출하 가능 차량은 0 이상 정수로 입력하세요'
      : data.availableTrucks > data.fleetSize ? '출하 가능 차량이 보유 차량보다 많을 수 없습니다'
      : !(data.availableVolume >= 0 && data.availableVolume <= 9999) ? '출하 가능 물량은 0~9999m³로 입력하세요'
      : data.isOpen && !types.length ? '생산 가능 콘크리트 종류를 하나 이상 선택하세요'
      : Object.values(capability.maxStrength).some((v) => !(v > 0 && v <= 100)) ? '최대 호칭강도는 0~100MPa 사이로 입력하세요'
      : data.isOpen && !capability.aggs.length ? '굵은골재 최대치수를 하나 이상 선택하세요'
      : data.isOpen && !capability.cements.length ? '보유 시멘트를 하나 이상 선택하세요' : null;
    if (err) return toast(err, 'warn');
    this.dirty = false;
    await Store.updatePlant(plant.id, data);
    toast('저장했습니다. 현장 검색 화면에 바로 반영됩니다.', 'ok');
  },
};

function openRejectSheet(orderId) {
  const reasons = ['출하 가능 차량 부족', '출하 가능 물량 부족', '해당 규격 생산 불가', '운반 시간 초과 우려', '요청 시간대 배차 불가', '기타'];
  Modal.open({
    title: '주문 거절',
    body: `<form class="form" id="rej-form">
      <div class="field"><span class="lbl">거절 사유</span>
        <div class="checks">${reasons.map((r, i) => `<label class="check"><input type="radio" name="reason" value="${r}" ${i === 0 ? 'checked' : ''}>${r}</label>`).join('')}</div>
      </div>
      <label class="field"><span class="lbl">현장에 전할 말 <small>선택</small></span><textarea name="memo" rows="2" maxlength="120" placeholder="예) 오후 3시 이후 출하 가능합니다"></textarea></label>
    </form>`,
    actions: [
      { label: '취소', kind: 'ghost' },
      {
        label: '거절하기', kind: 'danger',
        async onClick(api) {
          const fd = new FormData(api.el.querySelector('#rej-form'));
          const memo = String(fd.get('memo') || '').trim();
          const o = await OrderService.reject(orderId, memo ? `${fd.get('reason')} — ${memo}` : fd.get('reason'));
          toast(`${o.no} 거절했습니다`, 'ok');
        },
      },
    ],
  });
}

/* ---- 6-11. [레미콘사] 배차 ---- */
const DispatchView = {
  live: true, form: {}, previews: {}, items: [], mapE: null, ctx: null, plant: null, lastPreview: 0,
  async render(root, t) {
    const now = SimClock.now();
    const plants = await Store.listPlants();
    const plant = pickPlant(plants);
    const ctx = await loadCtx({ plantId: plant.id });
    if (App.stale(t)) return;
    this.ctx = ctx; this.plant = plant;
    const fleet = fleetStatus(plant, ctx.deliveries, now);
    const idle = fleet.filter((f) => f.state === 'idle');
    const queue = ctx.orders.filter((o) => ['accepted', 'delivering'].includes(o.status)).map((o) => {
      const dls = ctx.deliveries.filter((d) => d.orderId === o.id);
      const shipped = round1(sum(dls.map((d) => d.volume)));
      return { o, shipped, done: round1(sum(dls.filter((d) => d.completedAt).map((d) => d.volume))), remaining: round1(o.volume - shipped) };
    }).filter((x) => x.remaining > 0).sort((a, b) => a.o.pourAt - b.o.pourAt);
    const active = ctx.deliveries.filter((d) => DeliveryRules.phase(d, now) !== 'done');
    this.items = active;
    root.innerHTML = `
    <section class="view">
      ${supplierBarHtml(plants, plant)}
      <div class="stat-row">
        <div class="m"><span class="k">대기 차량</span><span class="v">${idle.length}<small>/${plant.fleetSize}대</small></span></div>
        <div class="m"><span class="k">운행 중</span><span class="v">${fleet.length - idle.length}<small>대</small></span></div>
        <div class="m"><span class="k">출하 가능 물량</span><span class="v">${plant.availableVolume}<small>m³</small></span></div>
      </div>
      <div class="section-head"><h2>출하 대기 주문</h2><span class="count-chip">${queue.length}</span></div>
      ${queue.length ? queue.map((x) => this.cardHtml(x, ctx, fleet)).join('')
        : emptyHtml('출하할 주문이 없습니다', '주문 관리에서 주문을 수락하면 여기에서 차량을 배정해 출하할 수 있습니다.')}
      <div class="section-head"><h2>운행 중 차량</h2><span class="count-chip">${active.length}</span></div>
      <div class="split">
        <div class="map-card split-map"><div data-map-slot></div></div>
        <div class="split-list">${active.length ? active.map((d) => deliveryCardHtml(d, ctx, now, 'supplier')).join('') : emptyHtml('운행 중인 차량이 없습니다')}</div>
      </div>
    </section>`;
    bindSupplierBar(root);
    $$('.dispatch[data-order]', root).forEach((card) => card.addEventListener('change', () => {
      this.form[card.dataset.order] = { truckId: card.querySelector('[data-f="truck"]').value, volume: card.querySelector('[data-f="volume"]').value };
    }));
    this.mapE = Maps.mount('dispatch', $('[data-map-slot]', root));
    if (this.mapE) DeliveryMap.draw(this.mapE, active, ctx, now, { plants: [plant.id] });
    this.refreshPreviews();
    this.tick(now);
  },
  cardHtml({ o, shipped, done, remaining }, ctx, fleet) {
    const site = ctx.site[o.siteId] || {};
    const st = this.form[o.id] || {};
    const idle = fleet.filter((f) => f.state === 'idle');
    const selTruck = idle.some((f) => f.truck.id === st.truckId) ? st.truckId : idle[0]?.truck.id;
    const maxVol = Math.min(TRUCK_CAPACITY_M3, remaining);
    const vol = st.volume != null && Number(st.volume) <= maxVol ? st.volume : maxVol;
    return `
    <article class="card order dispatch" data-order="${o.id}">
      <header class="order-head">
        <div><span class="mono">${esc(o.no)}</span><span class="pill tone-${ORDER_TONE[o.status]}">${ORDER_STATUS[o.status]}</span></div>
        <span class="muted sm">타설 희망 ${fmtDateTime(o.pourAt)}</span>
      </header>
      <p class="order-route"><b>${esc(site.name)}</b> <span class="muted sm">· ${esc(specText(o.spec))} · ${esc(cementShort(o.spec.cement))}</span></p>
      ${progressHtml(o.volume, shipped, done)}
      <div class="dispatch-form">
        <label class="field"><span class="lbl">배정 차량</span>
          <select data-f="truck" ${idle.length ? '' : 'disabled'}>${fleet.map((f) => `<option value="${f.truck.id}" ${f.state !== 'idle' ? 'disabled' : ''} ${f.truck.id === selTruck ? 'selected' : ''}>${f.truck.no}호차 · ${esc(f.truck.plateNo)}${f.state !== 'idle' ? ` (${TRUCK_LABEL[f.state]})` : ''}</option>`).join('')}</select>
        </label>
        <label class="field"><span class="lbl">적재 물량</span><span class="unit-input"><input data-f="volume" type="number" inputmode="decimal" min="0.5" step="0.5" max="${maxVol}" value="${vol}"><em>m³</em></span></label>
        <button type="button" class="btn primary" data-act="dispatch" ${idle.length ? '' : 'disabled'}>출하 지시 (비비기 시작)</button>
      </div>
      ${idle.length ? '' : '<p class="alert warn">대기 차량이 없습니다. 차량 복귀를 기다리거나 출하 현황에서 보유 차량을 늘리세요.</p>'}
      <p class="preview" data-preview>출하 예상 계산 중…</p>
    </article>`;
  },
  async refreshPreviews() {
    this.lastPreview = Date.now();
    const now = SimClock.now();
    for (const card of $$('.dispatch[data-order]')) {
      const order = this.ctx?.order[card.dataset.order];
      if (!order) continue;
      const p = await OrderService.planDelivery(order, this.plant, this.ctx.site[order.siteId], now);
      this.previews[order.id] = p;
      const el = card.querySelector('[data-preview]');
      if (!el) continue;
      el.className = `preview lv-${p.judge.level}`;
      el.innerHTML = `지금 출하하면 <b>${fmtTime(p.arriveAt)}</b> 현장 도착 예정 · 이동 ${p.travel.minutes}분 / 허용 ${p.allowedTravelMinutes}분
        <br><small>외기 ${p.tempC}℃${p.tempManual ? '(주문 시 입력값)' : ''} → 제한 ${p.limitMinutes}분 · 타설 기한 ${fmtTime(p.limitAt)}</small>`;
    }
  },
  tick(now) {
    updateLiveDeliveries(this.items, this.mapE, now);
    if (Date.now() - this.lastPreview > 15000) this.refreshPreviews();
  },
  actions: {
    async dispatch(b) {
      const card = b.closest('[data-order]');
      const orderId = card.dataset.order;
      const truckId = card.querySelector('[data-f="truck"]').value;
      const volume = parseFloat(card.querySelector('[data-f="volume"]').value);
      const pv = this.previews[orderId];
      if (pv?.judge.level === 'bad') {
        const ok = await Modal.confirm(`지금 출하하면 예상 이동 ${pv.travel.minutes}분으로 허용 이동시간(${pv.allowedTravelMinutes}분)을 넘습니다.\n그래도 출하할까요?`, { title: '타설 제한시간 주의', ok: '그래도 출하', danger: true });
        if (!ok) return;
      }
      b.disabled = true;
      try {
        const d = await OrderService.dispatch(orderId, truckId, volume);
        delete this.form[orderId];
        toast(`${d.truckNo}호차 출하 지시 — 비비기 시작 ${fmtTime(d.mixStartAt)}, ${fmtTime(d.etaInitialAt)} 도착 예정`, 'ok');
      } catch (err) { b.disabled = false; throw err; }
    },
  },
};

/* ---- 6-12. 앱 셸: 라우팅 · 재렌더 규칙 · 알림 · 타이머 ---- */
const TABS = {
  buyer: [
    { id: 'search', label: '공장 찾기', icon: 'search' },
    { id: 'tracking', label: '배송 추적', icon: 'truck' },
    { id: 'orders', label: '주문·납품서', icon: 'list' },
  ],
  supplier: [
    { id: 'stock', label: '출하 현황', icon: 'factory' },
    { id: 'orders', label: '주문 관리', icon: 'inbox' },
    { id: 'dispatch', label: '배차', icon: 'send' },
  ],
};
const VIEWS = {
  'buyer.search': SearchView, 'buyer.tracking': TrackingView, 'buyer.orders': BuyerOrdersView,
  'supplier.stock': StockView, 'supplier.orders': SupplierOrdersView, 'supplier.dispatch': DispatchView,
};
const CommonActions = {
  note(b) { return openDeliveryNote(b.dataset.id); },
  async confirm(b) {
    const ok = await Modal.confirm('타설 완료(인수)를 확인할까요?\n납품서에 완료 시각이 기록됩니다.', { title: '타설 완료 확인', ok: '완료 확인' });
    if (!ok) return;
    const d = await OrderService.confirmPour(b.dataset.id);
    const took = Math.round((d.completedAt - d.mixStartAt) / MIN);
    const within = took <= d.limitMinutes;
    toast(`${d.truckNo}호차 타설 완료 — 비비기 후 ${took}분 (제한 ${d.limitMinutes}분 ${within ? '이내' : '초과'})`, within ? 'ok' : 'warn');
  },
};

let pointerDown = false;
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
document.addEventListener('pointerup', () => setTimeout(() => { pointerDown = false; }, 0), true);
document.addEventListener('pointercancel', () => { pointerDown = false; }, true);
function isEditing() {
  const a = document.activeElement;
  return !!a && $('#view').contains(a) && a.matches('input:not([type=checkbox]):not([type=radio]), select, textarea');
}

const App = {
  current: null, seq: 0, pending: false,
  stale(t) { return t !== App.seq; },
  async render() {
    const view = VIEWS[`${ui.role}.${ui.tab[ui.role]}`] || SearchView;
    App.pending = false;
    App.current = view;
    renderChrome();
    const t = ++App.seq;
    try { await view.render($('#view'), t); } catch (err) {
      console.error(err);
      $('#view').innerHTML = `<div class="alert bad">화면을 그리는 중 오류가 발생했습니다: ${esc(err.message)}</div>`;
    }
  },
  /** 입력 중·클릭 중·저장 안 한 변경이 있으면 다시 그리기를 미룬다 (입력값·클릭이 날아가지 않도록) */
  canRender() { return !pointerDown && !isEditing() && !App.current?.isDirty?.(); },
  requestRender() { if (App.canRender()) App.render(); else App.pending = true; },
  go(role, tab) {
    if (role && role !== ui.role) { ui.role = role; history.replaceState(null, '', `#${role}`); }
    if (tab) ui.tab[ui.role] = tab;
    saveUi();
    window.scrollTo(0, 0);
    App.render();
  },
};

function renderChrome() {
  $$('.role-switch button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.role === ui.role)));
  const now = SimClock.now();
  const mine = (o) => o.plantId === ui.plantId;
  const counts = {
    'buyer.tracking': Live.deliveries.filter((d) => DeliveryRules.phase(d, now) !== 'done').length,
    'supplier.orders': Live.orders.filter((o) => mine(o) && o.status === 'requested').length,
    'supplier.dispatch': Live.orders.filter((o) => mine(o) && ['accepted', 'delivering'].includes(o.status) && remainingOf(o, Live.deliveries) > 0).length,
  };
  const cur = ui.tab[ui.role];
  $('#tabbar').innerHTML = TABS[ui.role].map((t) => {
    const c = counts[`${ui.role}.${t.id}`];
    return `<button type="button" data-tab="${t.id}" ${cur === t.id ? 'aria-current="page"' : ''}><span class="ico">${ICON[t.icon]}</span><span>${t.label}</span>${c ? `<b class="count">${c}</b>` : ''}</button>`;
  }).join('');
}

function paintClock(now) {
  const d = new Date(now);
  $('#clock').textContent = `${fmtDate(now)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $('#sim-chip').hidden = SimClock.speed === 1 && Math.abs(now - Date.now()) < MIN;
  $('#btn-speed').textContent = `배속 ×${SimClock.speed}`;
}

/** 다른 탭(= 다른 사용자)에서 생긴 변화를 알림으로 */
function notifyRemote(prev) {
  const prevOrders = indexBy(prev.orders), prevDl = indexBy(prev.deliveries), prevPlants = indexBy(prev.plants);
  const siteName = (id) => Live.sites.find((s) => s.id === id)?.name ?? '';
  const plantName = (id) => Live.plants.find((p) => p.id === id)?.name ?? '';
  for (const o of Live.orders) {
    const before = prevOrders[o.id];
    if (ui.role === 'supplier' && o.plantId === ui.plantId) {
      if (!before && o.status === 'requested') toast(`새 주문 요청 · ${siteName(o.siteId)} ${o.volume}m³`, 'info');
      else if (before && before.status !== o.status && o.status === 'cancelled') toast(`${o.no} 주문이 현장에서 취소되었습니다`, 'warn');
    }
    if (ui.role === 'buyer' && before && before.status !== o.status) {
      if (o.status === 'accepted') toast(`${plantName(o.plantId)}에서 ${o.no} 주문을 수락했습니다`, 'ok');
      if (o.status === 'rejected') toast(`${o.no} 주문이 거절되었습니다 · ${o.rejectReason || ''}`, 'bad');
    }
  }
  for (const d of Live.deliveries) {
    const before = prevDl[d.id];
    if (ui.role === 'buyer' && !before) toast(`${plantName(d.plantId)} ${d.truckNo}호차 출하 · ${fmtTime(d.etaInitialAt ?? d.arriveAt)} 도착 예정`, 'info');
    if (ui.role === 'supplier' && d.plantId === ui.plantId && before && !before.completedAt && d.completedAt) toast(`${d.truckNo}호차 현장 타설 완료 확인됨`, 'ok');
  }
  if (ui.role === 'buyer' && App.current === SearchView) {
    const changed = Live.plants.filter((p) => prevPlants[p.id] && prevPlants[p.id].updatedAt !== p.updatedAt);
    if (changed.length === 1) toast(`${changed[0].name} 출하 정보가 갱신되었습니다`, 'info');
  }
}

/** 시간 경과로 생기는 변화 (출발·도착·기한 임박) */
function notifyPhase(d, from, to) {
  if (from === to || !(ui.role === 'buyer' || d.plantId === ui.plantId)) return;
  const site = Live.sites.find((s) => s.id === d.siteId);
  if (to === 'transit') toast(`${d.truckNo}호차 공장 출발 · ${fmtTime(d.etaInitialAt ?? d.arriveAt)} 도착 예정`, 'info');
  else if (to === 'onsite') toast(`${d.truckNo}호차 현장 도착 (${site?.name ?? ''}) · 타설 기한 ${fmtTime(d.limitAt)}`, 'ok');
}

async function onStoreEvent(evt) {
  const prev = { orders: Live.orders, deliveries: Live.deliveries, plants: Live.plants };
  await Live.refresh();
  if (evt.remote) notifyRemote(prev);
  renderChrome();
  if (App.current?.onStoreChange) App.current.onStoreChange(evt); else App.requestRender();
}

let tickN = 0;
function tick() {
  const now = SimClock.now();
  paintClock(now);
  let changed = false;
  for (const d of Live.deliveries) {
    const key = Live.stateKey(d, now), prev = Live.phases[d.id];
    if (prev !== key) {
      if (prev !== undefined) { changed = true; notifyPhase(d, prev.split('/')[0], key.split('/')[0]); }
      Live.phases[d.id] = key;
    }
    if (!d.completedAt && !Live.warned.has(d.id) && d.limitAt - now < RULES.LIMIT_WARN_MIN * MIN) {
      Live.warned.add(d.id);
      if (ui.role === 'buyer' || d.plantId === ui.plantId) toast(`${d.truckNo}호차 타설 기한 ${fmtTime(d.limitAt)} — ${RULES.LIMIT_WARN_MIN}분 이내 남음`, 'warn');
    }
  }
  if (changed) { renderChrome(); if (App.current?.live) App.requestRender(); }
  if (App.pending && App.canRender()) App.render();
  App.current?.tick?.(now);
  if (++tickN % 2 === 0) OrderService.maintain(now).catch((err) => console.error(err));
}

function openDemoSettings() {
  const speeds = [1, 10, 30, 60];
  Modal.open({
    title: '시연 설정',
    body: `<div class="form">
      <div class="field"><span class="lbl">시연 배속 <small>차량 이동·타이머가 빨라집니다</small></span>
        <div class="seg" id="speed-seg">${speeds.map((s) => `<button type="button" data-speed="${s}" aria-pressed="${SimClock.speed === s}">×${s}</button>`).join('')}</div>
      </div>
      <div class="field"><span class="lbl">시연 순서</span>
        <ol class="guide">
          <li><b>현장 › 공장 찾기</b>: 현장·타설 시각·물량 입력 → 주문 가능 공장에 주문</li>
          <li><b>레미콘사 › 주문 관리</b>: 요청 수락 → <b>배차</b>: 차량 골라 출하 지시</li>
          <li><b>현장 › 배송 추적</b>: 위치·제한시간 확인 → 도착 후 타설 완료 확인 → 납품서</li>
        </ol>
      </div>
      <div class="field"><span class="lbl">실시간 연동 시연</span>
        <p class="sm muted">같은 브라우저에서 이 페이지를 탭 하나 더 열어 한쪽은 현장, 한쪽은 레미콘사로 두면 주문·수락·배차가 서로 바로 반영됩니다.</p>
        ${window.top === window.self ? '<a class="btn sm" href="#supplier" target="_blank" rel="noopener">레미콘사 화면을 새 탭으로 열기</a>' : ''}
      </div>
      <div class="field"><span class="lbl">데이터</span>
        <button type="button" class="btn danger" id="demo-reset">시연 데이터 초기화</button>
        <p class="sm muted">주문·배송 기록, 공장 입력값, 시연 시각을 처음 상태로 되돌립니다.</p>
      </div>
    </div>`,
    actions: [{ label: '닫기', kind: 'dark' }],
    onMount(m) {
      $('#speed-seg', m.el).addEventListener('click', (e) => {
        const b = e.target.closest('[data-speed]');
        if (!b) return;
        SimClock.setSpeed(Number(b.dataset.speed));
        $$('#speed-seg button', m.el).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      });
      $('#demo-reset', m.el).addEventListener('click', async () => {
        if (!(await Modal.confirm('시연 데이터를 모두 처음 상태로 되돌릴까요?', { title: '초기화', ok: '초기화', danger: true }))) return;
        SimClock.reset();
        Live.phases = {}; Live.warned = new Set(); Live.etaNotified = new Set();
        ui.spec = { ...DEFAULT_SPEC };
        ui.pourAt = defaultPourAt(); ui.tempOverride = null; ui.siteId = 's1'; saveUi();
        await Store.reset();
        for (const d of Live.deliveries) Live.phases[d.id] = Live.stateKey(d, SimClock.now());
        m.close();
        toast('시연 데이터를 초기화했습니다', 'ok');
        App.render();
      });
    },
  });
}

function bindChrome() {
  $('#logo').innerHTML = ICON.mixer;
  $('#btn-settings').innerHTML = ICON.sliders;
  $$('.role-switch button').forEach((b) => b.addEventListener('click', () => App.go(b.dataset.role)));
  $('#tabbar').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) App.go(null, b.dataset.tab); });
  $('#btn-settings').addEventListener('click', openDemoSettings);
  $('#btn-speed').addEventListener('click', () => {
    const order = [1, 10, 30, 60];
    const next = order[(order.indexOf(SimClock.speed) + 1) % order.length];
    SimClock.setSpeed(next);
    toast(`시연 배속 ×${next}`, 'info');
  });
  // 화면 안의 [data-act] 버튼은 현재 화면의 actions → 공용 actions 순으로 처리
  $('#view').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const fn = App.current?.actions?.[act] || CommonActions[act];
    if (!fn) return;
    e.preventDefault();
    try { await fn.call(App.current, b, e); } catch (err) { console.error(err); toast(err.message || String(err), 'bad'); }
  });
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (TABS[r] && r !== ui.role) App.go(r); });
  SimClock.onChange(() => { paintClock(SimClock.now()); renderChrome(); });
}

async function boot() {
  const hashRole = location.hash.slice(1);
  if (TABS[hashRole]) ui.role = hashRole;
  const now = SimClock.now();
  if (!ui.pourAt || ui.pourAt < now - 10 * MIN) ui.pourAt = defaultPourAt(now);
  saveUi();
  await Store.init();
  await Live.refresh();
  for (const d of Live.deliveries) {
    Live.phases[d.id] = Live.stateKey(d, now);
    if (d.limitAt - now < RULES.LIMIT_WARN_MIN * MIN) Live.warned.add(d.id);
  }
  Store.subscribe(onStoreEvent);
  bindChrome();
  paintClock(now);
  await App.render();
  setInterval(tick, 1000);
}
boot().catch((err) => {
  console.error(err);
  $('#view').innerHTML = `<div class="alert bad">초기화 중 오류가 발생했습니다: ${esc(err.message)}</div>`;
});
</script>
